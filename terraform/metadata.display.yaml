apiVersion: blueprints.cloud.google.com/v1alpha1
kind: BlueprintMetadata
metadata:
  name: opendso-gcp-marketplace-display
  annotations:
    config.kubernetes.io/local-config: "true"
spec:
  info:
    title: OpenDSO — Terraform Kubernetes deployment
    source:
      repo: https://github.com/openenergysolutions/opendso-gcp-marketplace.git
      sourceType: git
      dir: /terraform
  ui:
    input:
      sections:
        - name: cluster
          title: Target Cluster
          tooltip: The existing GKE cluster to deploy OpenDSO into.
        - name: deployment
          title: Deployment
          tooltip: Release identity and base configuration.
        - name: licensing
          title: Licensing (BYOL)
          tooltip: License and installation keys provided by OES.
        - name: credentials
          title: Administrator Credentials
          tooltip: Initial admin accounts for the bundled services.
        - name: advanced
          title: Advanced
          tooltip: Optional overrides; defaults are suitable for most deployments.
      variables:
        # --- Target cluster ---
        project_id:
          name: project_id
          title: Project ID
          section: cluster
          tooltip: GCP project that contains the target GKE cluster.
        cluster_name:
          name: cluster_name
          title: GKE Cluster Name
          section: cluster
          tooltip: Name of the existing GKE cluster.
        cluster_location:
          name: cluster_location
          title: Cluster Location
          section: cluster
          placeholder: us-central1
          tooltip: Region or zone of the GKE cluster (e.g. us-central1 or us-central1-a).

        # --- Deployment ---
        goog_cm_deployment_name:
          name: goog_cm_deployment_name
          title: Marketplace Deployment Name
          section: deployment
          tooltip: Populated by Cloud Marketplace UI deployments and used as the Helm release name.
        app_instance_name:
          name: app_instance_name
          title: Application Instance Name
          section: deployment
          tooltip: CLI fallback Helm release name when the Marketplace deployment name is not set.
        namespace:
          name: namespace
          title: Namespace
          section: deployment
          placeholder: opendso
          tooltip: Kubernetes namespace to deploy into.
        domain:
          name: domain
          title: Base Domain
          section: deployment
          placeholder: opendso.example.com
          tooltip: >-
            Base domain for all services. Subdomains api.<domain>,
            keycloak.<domain>, nats.<domain>, grafana.<domain> are derived from
            it. A wildcard *.<domain> must resolve to the ingress load balancer.
        resource_profile:
          name: resource_profile
          title: Resource Profile
          section: deployment
          tooltip: CPU/memory sizing preset applied to all services.
          enumValueLabels:
            - label: Minimal (dev / smoke test)
              value: minimal
            - label: Default (staging)
              value: default
            - label: Production (recommended for GKE)
              value: production
        storage_class:
          name: storage_class
          title: Storage Class
          section: deployment
          placeholder: dynamic-rwo
          tooltip: >-
            StorageClass for persistent volumes. dynamic-rwo on current Autopilot,
            standard-rwo on older clusters, premium-rwo for SSD.

        # --- Licensing ---
        license_key:
          name: license_key
          title: OpenDSO License Key
          section: licensing
          tooltip: License key obtained from OES. Required to activate the application.
        installation_key:
          name: installation_key
          title: OpenDSO Installation Key
          section: licensing
          tooltip: Installation key obtained from OES.

        # --- Credentials ---
        keycloak_admin_user:
          name: keycloak_admin_user
          title: Keycloak Admin Username
          section: credentials
        keycloak_admin_password:
          name: keycloak_admin_password
          title: Keycloak Admin Password
          section: credentials
          tooltip: Password for the Keycloak admin console.
        mongodb_root_username:
          name: mongodb_root_username
          title: MongoDB Root Username
          section: credentials
        mongodb_root_password:
          name: mongodb_root_password
          title: MongoDB Root Password
          section: credentials
        mongodb_app_username:
          name: mongodb_app_username
          title: MongoDB Application Username
          section: credentials
        mongodb_app_password:
          name: mongodb_app_password
          title: MongoDB Application Password
          section: credentials
        grafana_admin_user:
          name: grafana_admin_user
          title: Grafana Admin Username
          section: credentials
        grafana_admin_password:
          name: grafana_admin_password
          title: Grafana Admin Password
          section: credentials

        # --- Advanced ---
        create_namespace:
          name: create_namespace
          title: Create Namespace
          section: advanced
          tooltip: Create the namespace if it does not already exist.
        install_helm_release:
          name: install_helm_release
          title: Install Helm Release
          section: advanced
          tooltip: Install the OpenDSO Helm release. Marketplace validation disables this when creating a temporary cluster.
        create_cluster:
          name: create_cluster
          title: Create Validation Cluster
          section: advanced
          tooltip: Create a temporary GKE cluster for Cloud Marketplace validation.
        test_cluster_node_count:
          name: test_cluster_node_count
          title: Validation Cluster Nodes
          section: advanced
          tooltip: Initial node count for the optional Marketplace validation cluster.
        test_cluster_machine_type:
          name: test_cluster_machine_type
          title: Validation Cluster Machine Type
          section: advanced
          tooltip: Node machine type for the optional Marketplace validation cluster.
        test_cluster_disk_size_gb:
          name: test_cluster_disk_size_gb
          title: Validation Cluster Disk Size
          section: advanced
          tooltip: Node boot disk size in GB for the optional Marketplace validation cluster.
        test_cluster_min_master_version:
          name: test_cluster_min_master_version
          title: Validation Cluster Version
          section: advanced
          tooltip: Optional minimum master version for the Marketplace validation cluster.
        chart_version:
          name: chart_version
          title: Chart Version
          section: advanced
          tooltip: Version (tag) of the opendso chart to deploy.
        helm_chart_repo:
          name: helm_chart_repo
          title: Helm Chart Repository
          section: advanced
          tooltip: OCI repository containing the OpenDSO Helm chart.
        helm_chart_name:
          name: helm_chart_name
          title: Helm Chart Name
          section: advanced
          tooltip: OpenDSO Helm chart name.
        helm_chart_version:
          name: helm_chart_version
          title: Helm Chart Version
          section: advanced
          tooltip: OpenDSO Helm chart version/tag.
        opendso_image_repo:
          name: opendso_image_repo
          title: OpenDSO OCI Artifact Repository
          section: advanced
          tooltip: Marketplace-scanned OpenDSO OCI artifact repository.
        opendso_image_tag:
          name: opendso_image_tag
          title: OpenDSO OCI Artifact Tag
          section: advanced
          tooltip: Marketplace-scanned OpenDSO OCI artifact tag.
        image_registry:
          name: image_registry
          title: Image Registry
          section: advanced
          placeholder: us-central1-docker.pkg.dev/my-project/oesinc
          tooltip: >-
            Artifact Registry prefix for all images. Leave empty to use chart
            defaults; Cloud Marketplace repoints this to its published copies.
        additional_values:
          name: additional_values
          title: Additional Helm Values (YAML)
          section: advanced
          tooltip: Raw YAML merged into the release last (highest precedence).
