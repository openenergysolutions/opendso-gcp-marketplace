x-google-marketplace:
  schemaVersion: v2
  applicationApiVersion: v1beta1
  publishedVersion: "1.0.0"
  publishedVersionMetadata:
    releaseNote: Initial GKE Marketplace release
  managedUpdates:
    kalmSupported: false

  # ---------------------------------------------------------------------------
  # Image declarations
  #
  # All images share a single registry prefix (global.imageRegistry).
  # Image paths in values.yaml are relative to the registry:
  #   OES images:     gms-api, historian, ...
  #   Third-party:    citusdata/citus, mongodb/mongodb-community-server, ...
  #
  # All images must be present in the Artifact Registry repo before deploying.
  # ---------------------------------------------------------------------------
  images: {}

properties:
  # ---------------------------------------------------------------------------
  # Required: Application instance name (injected by GKE Marketplace)
  # ---------------------------------------------------------------------------
  name:
    type: string
    x-google-marketplace:
      type: NAME

  # ---------------------------------------------------------------------------
  # Image registry prefix
  # ---------------------------------------------------------------------------
  global.imageRegistry:
    type: string
    title: Image Registry
    description: >
      Artifact Registry prefix for all images,
      e.g. us-central1-docker.pkg.dev/my-project/oesinc
    default: ""
  
  # ---------------------------------------------------------------------------
  # Required: Kubernetes namespace (injected by GKE Marketplace)
  # ---------------------------------------------------------------------------
  namespace:
    type: string
    x-google-marketplace:
      type: NAMESPACE

  # ---------------------------------------------------------------------------
  # Required: License
  # ---------------------------------------------------------------------------
  license.key:
    type: string
    title: OpenDSO License Key
    description: >
      Your OpenDSO license key obtained from OES.
      Required to activate the application.
    x-google-marketplace:
      type: MASKED_FIELD

  installation.key:
    type: string
    title: OpenDSO Installation Key
    description: >
      Your OpenDSO installation key obtained from OES.
      Required to activate the application.
    x-google-marketplace:
      type: MASKED_FIELD

  # ---------------------------------------------------------------------------
  # Required: Domain configuration
  # ---------------------------------------------------------------------------
  global.domain:
    type: string
    title: Domain Name
    description: >
      Base domain for all OpenDSO services (e.g. opendso.example.com).
      Subdomains keycloak.<domain>, api.<domain>, nats.<domain> will be created.
    default: ""

  # ---------------------------------------------------------------------------
  # Keycloak admin credentials
  # ---------------------------------------------------------------------------
  keycloak.config.adminUser:
    type: string
    title: Keycloak Admin Username
    default: admin

  keycloak.config.adminPassword:
    type: string
    title: Keycloak Admin Password
    description: Password for the Keycloak admin console.
    x-google-marketplace:
      type: MASKED_FIELD

  # ---------------------------------------------------------------------------
  # MongoDB credentials
  # ---------------------------------------------------------------------------
  mongodb.auth.rootUsername:
    type: string
    title: MongoDB Root Username
    default: root

  mongodb.auth.rootPassword:
    type: string
    title: MongoDB Root Password
    x-google-marketplace:
      type: MASKED_FIELD

  mongodb.auth.username:
    type: string
    title: MongoDB App Username
    default: opendso

  mongodb.auth.password:
    type: string
    title: MongoDB App Password
    x-google-marketplace:
      type: MASKED_FIELD

  # ---------------------------------------------------------------------------
  # Grafana credentials
  # ---------------------------------------------------------------------------
  grafana.adminUser:
    type: string
    title: Grafana Admin Username
    default: admin

  grafana.adminPassword:
    type: string
    title: Grafana Admin Password
    x-google-marketplace:
      type: MASKED_FIELD

  # ---------------------------------------------------------------------------
  # Resource profile
  # ---------------------------------------------------------------------------
  global.resourceProfile:
    type: string
    title: Resource Profile
    description: Resource requests/limits profile for all services.
    default: default
    enum:
      - minimal
      - default
      - production

required:
  - namespace
  - license.key
  - installation.key
  - global.domain
  - keycloak.config.adminPassword
  - mongodb.auth.rootPassword
  - mongodb.auth.password
  - grafana.adminPassword
