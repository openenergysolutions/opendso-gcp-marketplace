x-google-marketplace:
  schemaVersion: v2
  applicationApiVersion: v1beta1
  publishedVersion: "1.0.0"
  publishedVersionMetadata:
    releaseNote: Initial GKE Marketplace release
  managedUpdates:
    kalmSupported: false

  # ---------------------------------------------------------------------------
  # Image declarations
  #
  # OES images share a single registry prefix (global.imageRegistry).
  # GCP Marketplace will substitute this with the marketplace-hosted registry
  # and rewrite all image references accordingly.
  #
  # Third-party images (nats, keycloak, mongodb, postgres, redis, envoy, citus,
  # timescaledb) must be mirrored into the marketplace Artifact Registry before
  # publishing. Their repository values in values.yaml will need updating once
  # mirrored.
  # ---------------------------------------------------------------------------
  images:
    # Primary OES registry — all OES service images share this prefix
    "":
      properties:
        global.imageRegistry:
          type: REGISTRY

    # Core services
    gms-api:
      properties:
        global.images.gmsApi.repository:
          type: REPO_WITH_REGISTRY
        global.images.gmsApi.tag:
          type: TAG
    historian-svc:
      properties:
        global.images.historianSvc.repository:
          type: REPO_WITH_REGISTRY
        global.images.historianSvc.tag:
          type: TAG
    openfmb-event-service:
      properties:
        global.images.openfmbEventService.repository:
          type: REPO_WITH_REGISTRY
        global.images.openfmbEventService.tag:
          type: TAG
    nats-auth-service:
      properties:
        global.images.natsAuthSvc.repository:
          type: REPO_WITH_REGISTRY
        global.images.natsAuthSvc.tag:
          type: TAG

    # Topology services
    topology-genesis:
      properties:
        global.images.topologyGenesis.repository:
          type: REPO_WITH_REGISTRY
        global.images.topologyGenesis.tag:
          type: TAG
    topology-nodes:
      properties:
        global.images.topologyNodes.repository:
          type: REPO_WITH_REGISTRY
        global.images.topologyNodes.tag:
          type: TAG

    # DER dispatch
    der-dispatch-svc:
      properties:
        global.images.derDispatchSvc.repository:
          type: REPO_WITH_REGISTRY
        global.images.derDispatchSvc.tag:
          type: TAG

    # CVR services
    cvr-svc:
      properties:
        global.images.cvrSvc.repository:
          type: REPO_WITH_REGISTRY
        global.images.cvrSvc.tag:
          type: TAG
    cvr-genetic-algorithm-svc:
      properties:
        global.images.cvrGeneticAlgorithmSvc.repository:
          type: REPO_WITH_REGISTRY
        global.images.cvrGeneticAlgorithmSvc.tag:
          type: TAG
    cvr-openfmb-services-svc:
      properties:
        global.images.cvrOpenfmbServicesSvc.repository:
          type: REPO_WITH_REGISTRY
        global.images.cvrOpenfmbServicesSvc.tag:
          type: TAG

    # ESS services
    ess-manager-svc:
      properties:
        global.images.essManagerSvc.repository:
          type: REPO_WITH_REGISTRY
        global.images.essManagerSvc.tag:
          type: TAG
    ess-tester-svc:
      properties:
        global.images.essTesterSvc.repository:
          type: REPO_WITH_REGISTRY
        global.images.essTesterSvc.tag:
          type: TAG

    # Asset health services
    asset-health-svc:
      properties:
        global.images.assetHealthSvc.repository:
          type: REPO_WITH_REGISTRY
        global.images.assetHealthSvc.tag:
          type: TAG
    asset-health-sim-svc:
      properties:
        global.images.assetHealthSimSvc.repository:
          type: REPO_WITH_REGISTRY
        global.images.assetHealthSimSvc.tag:
          type: TAG

    # Simulation services
    omegadss-svc:
      properties:
        global.images.omegadssSvc.repository:
          type: REPO_WITH_REGISTRY
        global.images.omegadssSvc.tag:
          type: TAG
    rpcdss-svc:
      properties:
        global.images.rpcdssSvc.repository:
          type: REPO_WITH_REGISTRY
        global.images.rpcdssSvc.tag:
          type: TAG

    # Frontend applications
    der-dispatch-app:
      properties:
        global.images.derDispatchApp.repository:
          type: REPO_WITH_REGISTRY
        global.images.derDispatchApp.tag:
          type: TAG
    genesis-node-app:
      properties:
        global.images.genesisNodeApp.repository:
          type: REPO_WITH_REGISTRY
        global.images.genesisNodeApp.tag:
          type: TAG
    data-viewer-app:
      properties:
        global.images.dataViewerApp.repository:
          type: REPO_WITH_REGISTRY
        global.images.dataViewerApp.tag:
          type: TAG
    schedule-dispatch-app:
      properties:
        global.images.scheduleDispatchApp.repository:
          type: REPO_WITH_REGISTRY
        global.images.scheduleDispatchApp.tag:
          type: TAG
    event-viewer-app:
      properties:
        global.images.eventViewerApp.repository:
          type: REPO_WITH_REGISTRY
        global.images.eventViewerApp.tag:
          type: TAG
    gis-app:
      properties:
        global.images.gisApp.repository:
          type: REPO_WITH_REGISTRY
        global.images.gisApp.tag:
          type: TAG
    historian-app:
      properties:
        global.images.historianApp.repository:
          type: REPO_WITH_REGISTRY
        global.images.historianApp.tag:
          type: TAG
    inspector-app:
      properties:
        global.images.inspectorApp.repository:
          type: REPO_WITH_REGISTRY
        global.images.inspectorApp.tag:
          type: TAG
    inventory-app:
      properties:
        global.images.inventoryApp.repository:
          type: REPO_WITH_REGISTRY
        global.images.inventoryApp.tag:
          type: TAG
    one-line-app:
      properties:
        global.images.oneLineApp.repository:
          type: REPO_WITH_REGISTRY
        global.images.oneLineApp.tag:
          type: TAG
    opendso-docs-app:
      properties:
        global.images.opendsoDocsApp.repository:
          type: REPO_WITH_REGISTRY
        global.images.opendsoDocsApp.tag:
          type: TAG
    openfmb-event-creator-app:
      properties:
        global.images.openfmbEventCreatorApp.repository:
          type: REPO_WITH_REGISTRY
        global.images.openfmbEventCreatorApp.tag:
          type: TAG
    ess-manager-app:
      properties:
        global.images.essManagerApp.repository:
          type: REPO_WITH_REGISTRY
        global.images.essManagerApp.tag:
          type: TAG
    ess-tester-app:
      properties:
        global.images.essTesterApp.repository:
          type: REPO_WITH_REGISTRY
        global.images.essTesterApp.tag:
          type: TAG

    # Third-party images (must be mirrored to marketplace registry before publishing)
    nats:
      properties:
        global.images.nats.repository:
          type: REPO_WITH_REGISTRY
        global.images.nats.tag:
          type: TAG
    keycloak:
      properties:
        global.images.keycloak.repository:
          type: REPO_WITH_REGISTRY
        global.images.keycloak.tag:
          type: TAG
    envoy:
      properties:
        global.images.envoy.repository:
          type: REPO_WITH_REGISTRY
        global.images.envoy.tag:
          type: TAG
    mongodb:
      properties:
        global.images.mongodb.repository:
          type: REPO_WITH_REGISTRY
        global.images.mongodb.tag:
          type: TAG
    citus-db:
      properties:
        global.images.citusDb.repository:
          type: REPO_WITH_REGISTRY
        global.images.citusDb.tag:
          type: TAG
    keycloak-db:
      properties:
        global.images.keycloakDb.repository:
          type: REPO_WITH_REGISTRY
        global.images.keycloakDb.tag:
          type: TAG
    opendso-apps-db:
      properties:
        global.images.appsDb.repository:
          type: REPO_WITH_REGISTRY
        global.images.appsDb.tag:
          type: TAG
    ess-manager-redis:
      properties:
        global.images.essManagerRedis.repository:
          type: REPO_WITH_REGISTRY
        global.images.essManagerRedis.tag:
          type: TAG

properties:
  # ---------------------------------------------------------------------------
  # Required: Kubernetes namespace (injected by GKE Marketplace)
  # ---------------------------------------------------------------------------
  namespace:
    type: string
    x-google-marketplace:
      type: NAMESPACE

  # ---------------------------------------------------------------------------
  # Required: License
  # ---------------------------------------------------------------------------
  license.key:
    type: string
    title: OpenDSO License Key
    description: >
      Your OpenDSO license key obtained from OES.
      Required to activate the application.
    x-google-marketplace:
      type: MASKED_FIELD

  # ---------------------------------------------------------------------------
  # Required: Domain configuration
  # ---------------------------------------------------------------------------
  global.domain:
    type: string
    title: Domain Name
    description: >
      Base domain for all OpenDSO services (e.g. opendso.example.com).
      Subdomains keycloak.<domain>, api.<domain>, nats.<domain> will be created.
    default: ""

  # ---------------------------------------------------------------------------
  # Keycloak admin credentials
  # ---------------------------------------------------------------------------
  keycloak.config.adminUser:
    type: string
    title: Keycloak Admin Username
    default: admin

  keycloak.config.adminPassword:
    type: string
    title: Keycloak Admin Password
    description: Password for the Keycloak admin console.
    x-google-marketplace:
      type: MASKED_FIELD

  # ---------------------------------------------------------------------------
  # MongoDB credentials
  # ---------------------------------------------------------------------------
  mongodb.auth.rootUsername:
    type: string
    title: MongoDB Root Username
    default: root

  mongodb.auth.rootPassword:
    type: string
    title: MongoDB Root Password
    x-google-marketplace:
      type: MASKED_FIELD

  mongodb.auth.username:
    type: string
    title: MongoDB App Username
    default: opendso

  mongodb.auth.password:
    type: string
    title: MongoDB App Password
    x-google-marketplace:
      type: MASKED_FIELD

  # ---------------------------------------------------------------------------
  # Grafana credentials
  # ---------------------------------------------------------------------------
  grafana.adminUser:
    type: string
    title: Grafana Admin Username
    default: admin

  grafana.adminPassword:
    type: string
    title: Grafana Admin Password
    x-google-marketplace:
      type: MASKED_FIELD

  # ---------------------------------------------------------------------------
  # Resource profile
  # ---------------------------------------------------------------------------
  global.resourceProfile:
    type: string
    title: Resource Profile
    description: Resource requests/limits profile for all services.
    default: default
    enum:
      - minimal
      - default
      - production

required:
  - namespace
  - license.key
  - global.domain
  - keycloak.config.adminPassword
  - mongodb.auth.rootPassword
  - mongodb.auth.password
  - grafana.adminPassword
