properties:
  # ---------------------------------------------------------------------------
  # Required: Application instance name (injected by GKE Marketplace)
  # ---------------------------------------------------------------------------
  name:
    type: string
    x-google-marketplace:
      type: NAME

  # ---------------------------------------------------------------------------
  # Image registry prefix
  # ---------------------------------------------------------------------------
  global.imageRegistry:
    type: string
    title: Image Registry
    description: >
      Artifact Registry prefix for all images,
      e.g. us-central1-docker.pkg.dev/my-project/oesinc
    default: ""
  
  # ---------------------------------------------------------------------------
  # Required: Kubernetes namespace (injected by GKE Marketplace)
  # ---------------------------------------------------------------------------
  namespace:
    type: string
    x-google-marketplace:
      type: NAMESPACE

  # ---------------------------------------------------------------------------
  # Required: License
  # ---------------------------------------------------------------------------
  license.key:
    type: string
    title: OpenDSO License Key
    description: >
      Your OpenDSO license key obtained from OES.
      Required to activate the application.
    x-google-marketplace:
      type: MASKED_FIELD

  installation.key:
    type: string
    title: OpenDSO Installation Key
    description: >
      Your OpenDSO installation key obtained from OES.
      Required to activate the application.
    x-google-marketplace:
      type: MASKED_FIELD

  # ---------------------------------------------------------------------------
  # Required: Domain configuration
  # ---------------------------------------------------------------------------
  global.domain:
    type: string
    title: Domain Name
    description: >
      Base domain for all OpenDSO services (e.g. opendso.example.com).
      Subdomains keycloak.<domain>, api.<domain>, nats.<domain> will be created.
    default: ""

  # ---------------------------------------------------------------------------
  # Keycloak admin credentials
  # ---------------------------------------------------------------------------
  keycloak.config.adminUser:
    type: string
    title: Keycloak Admin Username
    default: admin

  keycloak.config.adminPassword:
    type: string
    title: Keycloak Admin Password
    description: Password for the Keycloak admin console.
    x-google-marketplace:
      type: MASKED_FIELD

  # ---------------------------------------------------------------------------
  # MongoDB credentials
  # ---------------------------------------------------------------------------
  mongodb.auth.rootUsername:
    type: string
    title: MongoDB Root Username
    default: root

  mongodb.auth.rootPassword:
    type: string
    title: MongoDB Root Password
    x-google-marketplace:
      type: MASKED_FIELD

  mongodb.auth.username:
    type: string
    title: MongoDB App Username
    default: opendso

  mongodb.auth.password:
    type: string
    title: MongoDB App Password
    x-google-marketplace:
      type: MASKED_FIELD


  # ---------------------------------------------------------------------------
  # Apps DB — Cloud SQL (external PostgreSQL)
  # ---------------------------------------------------------------------------
  opendso-apps-db.externalDatabase.host:
    type: string
    title: Apps DB Host
    description: >
      Cloud SQL private IP or proxy address for the OpenDSO apps database
      (serves ess_tester and ofmb_db).
    default: ""

  opendso-apps-db.externalDatabase.username:
    type: string
    title: Apps DB Username
    default: essuser

  opendso-apps-db.externalDatabase.password:
    type: string
    title: Apps DB Password
    x-google-marketplace:
      type: MASKED_FIELD

  opendso-apps-db.externalDatabase.database:
    type: string
    title: Apps DB Name
    default: ess_tester

  # Kept for schema backwards compatibility — was present in prior submissions as MASKED_FIELD.
  # Grafana has been removed from the chart; this value is accepted but ignored.
  grafana.adminPassword:
    type: string
    title: Grafana Admin Password (unused)
    x-google-marketplace:
      type: MASKED_FIELD

  # ---------------------------------------------------------------------------
  # Resource profile
  # ---------------------------------------------------------------------------
  global.resourceProfile:
    type: string
    title: Resource Profile
    description: Resource requests/limits profile for all services.
    default: default
    enum:
      - minimal
      - default
      - production

required:
  - namespace
  - license.key
  - installation.key
  - global.domain
  - keycloak.config.adminPassword
  - mongodb.auth.rootPassword
  - mongodb.auth.password

