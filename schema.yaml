x-google-marketplace:
  schemaVersion: v2
  applicationApiVersion: v1beta1
  publishedVersion: "1.0.0"
  publishedVersionMetadata:
    releaseNote: Initial GKE Marketplace release
  managedUpdates:
    kalmSupported: false

  # ---------------------------------------------------------------------------
  # Image declarations
  #
  # All images share a single registry prefix (global.imageRegistry).
  # Image paths in values.yaml are relative to the registry:
  #   OES images:     gms-api, historian, ...
  #   Third-party:    citusdata/citus, mongodb/mongodb-community-server, ...
  #
  # All images must be present in the Artifact Registry repo before deploying.
  # ---------------------------------------------------------------------------
  images:
    nats:
      properties:
        global.images.nats.repository:
          type: REPO_WITH_REGISTRY
        global.images.nats.tag:
          type: TAG
    keycloak:
      properties:
        global.images.keycloak.repository:
          type: REPO_WITH_REGISTRY
        global.images.keycloak.tag:
          type: TAG
    mongodb:
