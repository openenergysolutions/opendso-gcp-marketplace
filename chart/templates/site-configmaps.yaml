# Site-specific ConfigMaps generated from configs/ directory
# These ConfigMaps are created based on the selected site (global.site)

{{- $site := .Values.global.site | default "ieee13" }}

# Keycloak ConfigMap
{{- if (index .Values.global "keycloak").enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-keycloak-site-config
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  keycloak.conf: |
{{ .Files.Get (printf "configs/%s/keycloak/conf/keycloak.conf" $site) | indent 4 }}
{{- end }}

# Keycloak Realm Import ConfigMap
# Dynamically replaces hard-coded domain/port in realm JSON with ingress values
{{- if (index .Values.global "keycloak").enabled }}
{{- $domain := .Values.global.domain | default .Values.ingress.domain }}
{{- $httpsPort := .Values.ingress.ports.https | toString }}
{{- $hostSuffix := "" }}
{{- if and $httpsPort (ne $httpsPort "443") }}
{{- $hostSuffix = printf ":%s" $httpsPort }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-keycloak-realm-import
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  oes-realm.json: |
{{- /* Prefer the generated realm (with injected secrets) if it exists; fall back to base */ -}}
{{- $generatedRealmFile := printf "configs/%s/keycloak/realm/oes-realm-generated.json" $site }}
{{- $realmJson := "" }}
{{- if .Files.Glob $generatedRealmFile }}
{{- $realmJson = .Files.Get $generatedRealmFile }}
{{- else }}
{{- $realmJson = .Files.Get (printf "configs/%s/keycloak/realm/oes-realm.json" $site) }}
{{- end }}
{{- /* Replace hard-coded local URLs with actual ingress configuration */ -}}
{{- $realmJson = $realmJson | replace "demo-gcp.oesinc.dev" (printf "%s%s" $domain $hostSuffix) }}
{{- $realmJson = $realmJson | replace "gms.demo-gcp.oesinc.dev" (printf "gms.%s%s" $domain $hostSuffix) }}
{{- $realmJson = $realmJson | replace "keycloak.demo-gcp.oesinc.dev" (printf "keycloak.%s%s" $domain $hostSuffix) }}
{{- $realmJson = $realmJson | replace "gis.demo-gcp.oesinc.dev" (printf "gis.%s%s" $domain $hostSuffix) }}
{{- $realmJson = $realmJson | replace "scheduledispatch.demo-gcp.oesinc.dev" (printf "scheduledispatch.%s%s" $domain $hostSuffix) }}
{{- $realmJson = $realmJson | replace "derdispatch.demo-gcp.oesinc.dev" (printf "derdispatch.%s%s" $domain $hostSuffix) }}
{{- $realmJson = $realmJson | replace "historian.demo-gcp.oesinc.dev" (printf "historian.%s%s" $domain $hostSuffix) }}
{{- $realmJson = $realmJson | replace "openfmbeventcreator.demo-gcp.oesinc.dev" (printf "openfmbeventcreator.%s%s" $domain $hostSuffix) }}
{{- $realmJson = $realmJson | replace "inspector.demo-gcp.oesinc.dev" (printf "inspector.%s%s" $domain $hostSuffix) }}
{{- $realmJson = $realmJson | replace "device.demo-gcp.oesinc.dev" (printf "device.%s%s" $domain $hostSuffix) }}
{{- $realmJson = $realmJson | replace "oneline.demo-gcp.oesinc.dev" (printf "oneline.%s%s" $domain $hostSuffix) }}
{{- $realmJson = $realmJson | replace "openfmb.demo-gcp.oesinc.dev" (printf "openfmb.%s%s" $domain $hostSuffix) }}
{{- $realmJson = $realmJson | replace "dataviewer.demo-gcp.oesinc.dev" (printf "dataviewer.%s%s" $domain $hostSuffix) }}
{{- $realmJson = $realmJson | replace "docs.demo-gcp.oesinc.dev" (printf "docs.%s%s" $domain $hostSuffix) }}
{{- $realmJson = $realmJson | replace "eventviewer.demo-gcp.oesinc.dev" (printf "eventviewer.%s%s" $domain $hostSuffix) }}
{{- $realmJson = $realmJson | replace "inventory.demo-gcp.oesinc.dev" (printf "inventory.%s%s" $domain $hostSuffix) }}
{{- $realmJson = $realmJson | replace "maverick.demo-gcp.oesinc.dev" (printf "maverick.%s%s" $domain $hostSuffix) }}
{{- $realmJson = $realmJson | replace "esstesting.demo-gcp.oesinc.dev" (printf "esstesting.%s%s" $domain $hostSuffix) }}
{{ $realmJson | indent 4 }}
  master-realm.json: |
{{ .Files.Get (printf "configs/%s/keycloak/realm/master-realm.json" $site) | indent 4 }}
{{- end }}

