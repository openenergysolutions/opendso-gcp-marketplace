# Genesis Node App ConfigMap (site-specific settings)
{{- if (index .Values.global "genesis-node-app").enabled }}
{{- $domain := .Values.global.domain | default .Values.ingress.domain }}
{{- $httpsPort := .Values.ingress.ports.https | toString }}
{{- $hostSuffix := "" }}
{{- if and $httpsPort (ne $httpsPort "443") }}
{{- $hostSuffix = printf ":%s" $httpsPort }}
{{- end }}
{{- $keycloakUrl := include "opendso.keycloakUrl" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-genesis-node-app-site-config
  labels:
    app.kubernetes.io/name: genesis-node-app
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  algorithm.json: |
{{ .Files.Get (printf "configs/%s/genesis-node-app/algorithm.json" $site) | indent 4 }}
  applicationsSettings.json: |
{{ .Files.Get (printf "configs/%s/genesis-node-app/applicationsSettings.json" $site) | indent 4 }}
  der.json: |
{{ .Files.Get (printf "configs/%s/genesis-node-app/der.json" $site) | indent 4 }}
  environment.json: |
    {
      "api": {
        "uri": {{ printf "%s/api" .Values.global.environment.apiUrl | quote }}
      },
      "keycloakUrl": {{ $keycloakUrl | quote }},
      "keycloakRealm": {{ .Values.global.keycloak.realm | default "oes" | quote }},
      "keycloakClientId": {{ ((.Values.global.keycloak.clientIds).ui) | default "gms" | quote }},
      "googleTagId": {{ .Values.global.environment.googleTagId | default "GTM-B7JGQS2" | quote }},
      "googleTagEnv": {{ .Values.global.environment.googleTagEnv | default "&gtm_auth=NaiPwz5U_xGuF4hoZ7yHUw&gtm_preview=env-5&gtm_cookies_win=x" | quote }}
    }
  historianState.json: |
{{ .Files.Get (printf "configs/%s/genesis-node-app/historianState.json" $site) | indent 4 }}
  servicesSettings.json: |
{{ .Files.Get (printf "configs/%s/genesis-node-app/servicesSettings.json" $site) | indent 4 }}
{{- end }}

