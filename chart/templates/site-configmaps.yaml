# DER Dispatch Service ConfigMap
# Note: This mounts the topology-nodes config which maps circuit UUIDs to node lists
# This matches docker-compose behavior where CIRCUIT_CONFIG is mounted to /resources/config.yml
{{- if (index .Values.global "der-dispatch-svc").enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-der-dispatch-svc-config
  labels:
    app.kubernetes.io/name: der-dispatch-svc
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  config.yml: |
{{- $derDispatchConfig := .Files.Get (printf "configs/%s/topology-nodes/config.yaml" $site) }}
{{ tpl $derDispatchConfig . | indent 4 }}
{{- end }}

# Citus DB Init Script ConfigMap
