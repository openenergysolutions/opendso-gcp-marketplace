# Site-specific ConfigMaps generated from configs/ directory
# These ConfigMaps are created based on the selected site (global.site)

{{- $site := .Values.global.site | default "ieee13" }}

# Keycloak ConfigMap
{{- if (index .Values.global "keycloak").enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-keycloak-site-config
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  keycloak.conf: |
{{ .Files.Get (printf "configs/%s/keycloak/conf/keycloak.conf" $site) | indent 4 }}
{{- end }}

# Keycloak Realm Import ConfigMap
# Dynamically replaces hard-coded domain/port in realm JSON with ingress values
{{- if (index .Values.global "keycloak").enabled }}
{{- $domain := .Values.global.domain | default .Values.ingress.domain }}
{{- $httpsPort := .Values.ingress.ports.https | toString }}
{{- $hostSuffix := "" }}
{{- if and $httpsPort (ne $httpsPort "443") }}
{{- $hostSuffix = printf ":%s" $httpsPort }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-keycloak-realm-import
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  oes-realm.json: |
{{- /* Prefer the generated realm (with injected secrets) if it exists; fall back to base */ -}}
{{- $generatedRealmFile := printf "configs/%s/keycloak/realm/oes-realm-generated.json" $site }}
{{- $realmJson := "" }}
{{- if .Files.Glob $generatedRealmFile }}
{{- $realmJson = .Files.Get $generatedRealmFile }}
{{- else }}
{{- $realmJson = .Files.Get (printf "configs/%s/keycloak/realm/oes-realm.json" $site) }}
{{- end }}
{{- /* Replace neutral placeholders with the actual ingress domain/port */ -}}
{{- $realmJson = $realmJson | replace "__BASE_DOMAIN__" (printf "%s%s" $domain $hostSuffix) }}
{{ $realmJson | indent 4 }}
  master-realm.json: |
{{ .Files.Get (printf "configs/%s/keycloak/realm/master-realm.json" $site) | indent 4 }}
{{- end }}

# Topology Genesis ConfigMap
# Skipped when global.topology-genesis.externalConfigMap=true (ConfigMap pre-created via
# kubectl apply --server-side to avoid the 262KB Kubernetes annotation limit).
{{- if and (index .Values.global "topology-genesis").enabled (not (dig "topology-genesis" "externalConfigMap" false .Values.global)) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-topology-genesis-site-config
  labels:
    app.kubernetes.io/name: topology-genesis
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  cim.xml: |
{{ .Files.Get (printf "configs/%s/topology-genesis/cim.xml" $site) | indent 4 }}
  cimex.config: |
{{ .Files.Get (printf "configs/%s/topology-genesis/cimex.config" $site) | indent 4 }}
{{- end }}

