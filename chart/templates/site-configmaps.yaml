# OpenDSO Apps DB Init Script ConfigMap
{{- $appsDbVals := .Values | toYaml | fromYaml -}}
{{- $appsDbExternal := and (dig "opendso-apps-db" "externalDatabase" "enabled" false $appsDbVals) (dig "opendso-apps-db" "externalDatabase" "host" "" $appsDbVals) -}}
{{- if and (index .Values.global "opendso-apps-db").enabled (not $appsDbExternal) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-opendso-apps-db-initdb
  labels:
    app.kubernetes.io/name: opendso-apps-db
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
{{ (.Files.Glob (printf "configs/%s/opendso-apps-db/schema/*.sql" $site)).AsConfig | indent 2 }}
  # gms-api seed is templated (Helm values -> env-specific URLs) via tpl, unlike
  # the verbatim schema files above. Keyed 40_* so the entrypoint runs it after
  # the schema DDL (30_gms_api.sql). Values are resolved nil-safely with dig (the
  # chart's existing idiom) and passed as a flat context, so the seed renders
  # regardless of partial value sets (e.g. a clobbered global.keycloak block).
  40_gms_api_seed.sql: |
{{- $domain := .Values.global.domain | default (dig "domain" "" (.Values.ingress | default dict)) }}
{{- $seedCtx := dict
      "clientId" (dig "keycloak" "clientIds" "api" "gms" .Values.global)
      "realm" (dig "keycloak" "realm" "oes" .Values.global)
      "domain" $domain
      "site" (.Values.global.site | default "ieee13")
      "natsAuth" (dig "nats-auth-svc" "enabled" false .Values.global) }}
{{ tpl (.Files.Get (printf "configs/%s/opendso-apps-db/seed/40_gms_api_seed.sql" $site)) (dict "ctx" $seedCtx) | indent 4 }}
{{- end }}

