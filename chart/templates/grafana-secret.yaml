{{- if (index .Values.global "grafana").enabled }}
{{- $citus := include "opendso.citusDb.settings" . | fromYaml }}
{{- $opendsoappsdb := include "opendso.appsDb.settings" . | fromYaml }}
{{- $mongodb := include "opendso.mongodb.settings" . | fromYaml }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-grafana-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  # Admin credentials
  admin-user: {{ .Values.grafana.adminUser | quote }}
  admin-password: {{ required "grafana.adminPassword is required" .Values.grafana.adminPassword | quote }}

  # Citus DB (PostgreSQL) credentials for datasources
  citus-password: {{ $citus.password | quote }}

  # OpenDSO Apps DB credentials for datasources
  opendso-apps-db-password: {{ $opendsoappsdb.password | quote }}

  # MongoDB credentials for datasources
  mongodb-password: {{ $mongodb.password | quote }}
{{- end }}
