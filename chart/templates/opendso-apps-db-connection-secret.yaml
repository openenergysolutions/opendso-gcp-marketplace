{{/*
Shared connection secret for der-dispatch-svc, historian-svc, and gms-api
(and the in-cluster opendso-apps-db StatefulSet's own Postgres bootstrap,
which expects this exact secret name/password key too).

The three consuming subcharts need opendso-apps-db's real connection info
(host, port, username, password), but as sibling subcharts they can't see
opendso-apps-db's externalDatabase/auth values directly -- Helm only
propagates values nested under `global` across sibling subcharts, and this
data isn't. opendso.appsDb.settings resolves it correctly for both the
in-cluster and external-database cases, but only when called from a context
that has the full values tree, which this (the umbrella chart's own
templates) is and the consuming subcharts are not. This template is the
single, canonical place that secret gets created, in either mode; the
opendso-apps-db subchart no longer creates its own copy.
*/}}
{{- $appsDb := include "opendso.appsDb.settings" . | fromYaml }}
{{- $vals := .Values | toYaml | fromYaml }}
{{- $external := and (dig "opendso-apps-db" "externalDatabase" "enabled" false $vals) (dig "opendso-apps-db" "externalDatabase" "host" "" $vals) }}
{{- if not $external }}
{{- if not $appsDb.password }}
{{- fail "opendso-apps-db auth.password is required when using the in-cluster database" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-opendso-apps-db-secret
  labels:
    {{- include "opendso.labels" . | nindent 4 }}
type: Opaque
data:
  host: {{ $appsDb.host | b64enc | quote }}
  port: {{ $appsDb.port | toString | b64enc | quote }}
  username: {{ $appsDb.user | b64enc | quote }}
  password: {{ $appsDb.password | b64enc | quote }}
