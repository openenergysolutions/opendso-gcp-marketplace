apiVersion: app.k8s.io/v1beta1
kind: Application
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    kubernetes-engine.cloud.google.com/icon: >-
      data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==
    marketplace.cloud.google.com/deploy-info: '{"partner_id": "oesinc", "product_id": "opendso", "partner_name": "Open Energy Solutions Inc."}'
spec:
  descriptor:
    type: OpenDSO
    version: {{ .Chart.AppVersion | quote }}
    description: >-
      OpenDSO is an open-source Distribution System Operator platform
      for managing grid-edge devices, distributed energy resources (DERs),
      and microgrid operations using the OpenFMB standard.
    maintainers:
      - name: OpenDSO Team
        email: info@openenergysolutions.com
        url: https://github.com/openenergysolutions/opendso-helm-charts
    links:
      - description: Documentation
        url: https://github.com/openenergysolutions/opendso-helm-charts
      - description: GMS Frontend
        url: https://{{ index .Values.global "environment" | default dict | dig "apiUrl" "" | trimPrefix "https://api." | printf "oneline.%s" }}
      - description: Keycloak Admin Console
        url: {{ include "opendso.keycloakUrl" . }}/admin
      - description: Grafana Dashboards
        url: https://grafana.{{ .Values.global.domain }}

  # Selector matches all resources deployed by this release
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}

  # All Kubernetes resource kinds managed by this application
  componentKinds:
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: PersistentVolumeClaim
    - group: networking.k8s.io
      kind: Ingress
    - group: batch
      kind: Job
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: policy
      kind: PodDisruptionBudget

  # Key/value info displayed in the GKE Marketplace console
  info:
    - name: Domain
      value: {{ .Values.global.domain }}
    - name: Keycloak URL
      value: {{ include "opendso.keycloakUrl" . }}
    - name: GMS API URL
      value: {{ index .Values.global "environment" | default dict | dig "apiUrl" (printf "https://api.%s" .Values.global.domain) }}
    - name: NATS WebSocket URL
      value: wss://nats.{{ .Values.global.domain }}
    - name: Grafana URL
      value: https://grafana.{{ .Values.global.domain }}
    - name: Site Configuration
      value: {{ .Values.global.site }}
    - name: Resource Profile
      value: {{ .Values.global.resourceProfile | default "default" }}
    - name: Chart Version
      value: {{ .Chart.Version }}
    - name: App Version
      value: {{ .Chart.AppVersion }}
