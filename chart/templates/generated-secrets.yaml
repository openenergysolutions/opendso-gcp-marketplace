{{- /*
Deployment-generated secrets that the imperative deployer/deploy.sh used to
create with kubectl. Making them Helm-managed lets the chart deploy itself via
a plain helm_release (Terraform / GKE Marketplace) with no external scripting.

  - <release>-<client>-keycloak-env : one per Keycloak client referenced by a
    REPLACE_SECRET_<client> placeholder in the realm JSON. Consumed via
    `envFrom` by the backend services. The KEYCLOAK_CLIENT_SECRET here must match
    the value substituted into the realm import ConfigMap (see site-configmaps.yaml)
    so Keycloak's imported client and the service agree.
  - <release>-opendso-license : license env vars consumed by topology-nodes.

Client secrets and DB passwords are derived deterministically (see
opendso.derivedSecret) so every reference computes the same value without a
cluster round-trip.
*/ -}}
{{- if (index .Values.global "keycloak").enabled }}
{{- $root := . }}
{{- $kcExternal := printf "%s/realms/%s" (include "opendso.keycloakUrl" .) (.Values.global.keycloak.realm | default "oes") }}
{{- $kcInternal := printf "%s/realms/%s" (include "opendso.keycloakInternalUrl" .) (.Values.global.keycloak.realm | default "oes") }}
{{- $clients := include "opendso.keycloakClientNames" . }}
{{- range $client := (splitList "," $clients) }}
{{- if $client }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $root.Release.Name }}-{{ $client }}-keycloak-env
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "opendso.labels" $root | nindent 4 }}
    app.kubernetes.io/component: keycloak-client
type: Opaque
stringData:
  KEYCLOAK_URL: {{ $kcInternal | quote }}
  KEYCLOAK_INTERNAL_URL: {{ $kcInternal | quote }}
  KEYCLOAK_EXTERNAL_URL: {{ $kcExternal | quote }}
  KEYCLOAK_CLIENT_ID: {{ $client | quote }}
  KEYCLOAK_CLIENT_SECRET: {{ include "opendso.keycloakClientSecret" (dict "root" $root "client" $client) | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- if (index .Values.global "topology-nodes").enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-opendso-license
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opendso.labels" . | nindent 4 }}
    app.kubernetes.io/component: license
type: Opaque
stringData:
  LICENSE_KEY: {{ .Values.license.key | default "" | quote }}
  LICENSE_INSTALLATION_KEY: {{ .Values.installation.key | default "" | quote }}
  LICENSE_ENVIRONMENT_NAME: {{ include "opendso.clusterSeed" . | default .Release.Name | quote }}
  LICENSE_API_URL: {{ .Values.license.apiUrl | default "" | quote }}
{{- end }}
