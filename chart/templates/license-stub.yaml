{{- if .Values.global.gcpMarketplace }}
# ---------------------------------------------------------------------------
# GCP Marketplace license stub
#
# topology-nodes calls POST <LICENSE_API_URL>/v1/license/validate at startup.
# During mpdev verify the keys are "test" / "test" — a real license API
# would reject them. This stub always returns {"valid":true} so the pod
# starts successfully during Marketplace verification.
#
# It is only deployed when global.gcpMarketplace=true (set by deploy.sh).
# Production installs with real license keys skip this entirely.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-license-stub-script
  labels:
    app.kubernetes.io/name: license-stub
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  server.sh: |
    #!/bin/sh
    BODY='{"valid":true,"plan":"marketplace","features":["all"],"quotas":{}}'
    BODY_LEN=${#BODY}
    RESPONSE="HTTP/1.1 200 OK\r\nContent-Type: application/json\r\nContent-Length: ${BODY_LEN}\r\nConnection: close\r\n\r\n${BODY}"
    while true; do
      echo -e "$RESPONSE" | nc -l -p 8080
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-license-stub
  labels:
    app.kubernetes.io/name: license-stub
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: license-stub
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: license-stub
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: license-stub
          image: busybox:1.36
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          command: [sh, /scripts/server.sh]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: script
          configMap:
            name: {{ .Release.Name }}-license-stub-script
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-license-stub
  labels:
    app.kubernetes.io/name: license-stub
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  selector:
    app.kubernetes.io/name: license-stub
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: 80
      targetPort: 8080
{{- end }}
