{{/*
ess-manager-svc app-config storage connection URL.

ess-manager stores its app config in the `ess_manager` database on
opendso-apps-db (in-cluster or Cloud SQL), as the kv_store table. Its
app.yaml takes a single storage_url, with {{VAR}} placeholders replaced from
the environment at startup, so the full URL is built here -- where
opendso.appsDb.settings resolves the real connection info for both database
modes -- and handed to the pod as ESS_MANAGER_STORAGE_URL. The user and
password are percent-encoded so characters such as @, : or / in a
customer-chosen password don't break the URL.
*/}}
{{- if (index .Values.global "ess-manager-svc").enabled }}
{{- $appsDb := include "opendso.appsDb.settings" . | fromYaml }}
{{- $user := urlquery $appsDb.user | replace "+" "%20" }}
{{- $pass := urlquery $appsDb.password | replace "+" "%20" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-ess-manager-storage
  labels:
    {{- include "opendso.labels" . | nindent 4 }}
type: Opaque
stringData:
  ESS_MANAGER_STORAGE_URL: {{ printf "postgres://%s:%s@%s:%v/ess_manager" $user $pass $appsDb.host $appsDb.port | quote }}
{{- end }}
