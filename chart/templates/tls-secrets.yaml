{{- $tlsSecretName := .Values.ingress.tls.secretName | default .Values.global.tls.existingSecret | default (printf "%s-tls-secret" .Release.Name) -}}
{{- $existingTlsSecret := lookup "v1" "Secret" .Release.Namespace $tlsSecretName -}}
{{- $existingRootCa := lookup "v1" "Secret" .Release.Namespace "root-ca" -}}
{{- $existingServerCert := lookup "v1" "Secret" .Release.Namespace "server-cert" -}}
{{- $existingServerKey := lookup "v1" "Secret" .Release.Namespace "server-key" -}}
{{- $tls := dict "caCert" (.Values.global.tls.caCert | default "") "serverCert" (.Values.global.tls.serverCert | default "") "serverKey" (.Values.global.tls.serverKey | default "") -}}
{{- if $existingTlsSecret }}
  {{- if and (not (get $tls "serverCert")) (hasKey $existingTlsSecret.data "tls.crt") }}
    {{- $_ := set $tls "serverCert" ((index $existingTlsSecret.data "tls.crt") | b64dec) -}}
  {{- end }}
  {{- if and (not (get $tls "serverKey")) (hasKey $existingTlsSecret.data "tls.key") }}
    {{- $_ := set $tls "serverKey" ((index $existingTlsSecret.data "tls.key") | b64dec) -}}
  {{- end }}
{{- end }}
{{- if and $existingRootCa (not (get $tls "caCert")) (hasKey $existingRootCa.data "ca.pem") }}
  {{- $_ := set $tls "caCert" ((index $existingRootCa.data "ca.pem") | b64dec) -}}
{{- end }}
{{- if or (not (get $tls "serverCert")) (not (get $tls "serverKey")) }}
  {{- $domain := .Values.global.domain | default (printf "%s.localtest.me" .Release.Name) -}}
  {{- $altNames := list $domain (printf "*.%s" $domain) (printf "api.%s" $domain) (printf "keycloak.%s" $domain) (printf "nats.%s" $domain) "localhost" -}}
  {{- $ca := genCA (printf "%s-opendso-ca" .Release.Name) 3650 -}}
  {{- $cert := genSignedCert $domain nil $altNames 3650 $ca -}}
  {{- if not (get $tls "caCert") }}
    {{- $_ := set $tls "caCert" $ca.Cert -}}
  {{- end }}
  {{- $_ := set $tls "serverCert" $cert.Cert -}}
  {{- $_ := set $tls "serverKey" $cert.Key -}}
{{- end }}
{{- $shouldManageTls := .Values.global.tls.createSecrets -}}
{{- if and $shouldManageTls (not $existingTlsSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tlsSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opendso.labels" . | nindent 4 }}
    app.kubernetes.io/component: tls
type: kubernetes.io/tls
data:
  tls.crt: {{ get $tls "serverCert" | b64enc | quote }}
  tls.key: {{ get $tls "serverKey" | b64enc | quote }}
{{- end }}
{{- if and $shouldManageTls (not $existingRootCa) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: root-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opendso.labels" . | nindent 4 }}
    app.kubernetes.io/component: tls
type: Opaque
data:
  ca.pem: {{ get $tls "caCert" | b64enc | quote }}
{{- end }}
{{- if and $shouldManageTls (not $existingServerCert) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: server-cert
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opendso.labels" . | nindent 4 }}
    app.kubernetes.io/component: tls
type: Opaque
data:
  server-cert.pem: {{ get $tls "serverCert" | b64enc | quote }}
{{- end }}
{{- if and $shouldManageTls (not $existingServerKey) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: server-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opendso.labels" . | nindent 4 }}
    app.kubernetes.io/component: tls
type: Opaque
data:
  server-key.pem: {{ get $tls "serverKey" | b64enc | quote }}
{{- end }}
