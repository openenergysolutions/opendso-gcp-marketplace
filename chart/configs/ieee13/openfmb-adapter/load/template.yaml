name: device1
polls:
- name: static_data_scan
  interval-ms: 1000
  classes:
    class0: true
    class1: false
    class2: false
    class3: false
channel:
  adapter: 0.0.0.0
  outstation-ip: 127.0.0.1
  port: 20000
protocol:
  master-address: 1
  outstation-address: 10
  startup-integrity:
    class0: false
    class1: false
    class2: false
    class3: false
  unsolicited:
    class1: true
    class2: true
    class3: true
file:
  id: openfmb-adapter-template
  edition: 2.1
  version: 2.1.0.0
  plugin: dnp3-master
profiles:
- name: LoadControlProfile
  command-order:
  - some-command-id
  - set-kw
  tolerance-ms: 5000
  mapping:
    controlMessageInfo:
      messageInfo:
        identifiedObject:
          description:
            value:
              string-field-type: ignored
          mRID:
            value:
              string-field-type: generated_uuid
          name:
            value:
              string-field-type: ignored
        messageTimeStamp:
          timestamp-field-type: message
    energyConsumer:
      conductingEquipment:
        namedObject:
          description:
            value:
              string-field-type: ignored
          name:
            value:
              string-field-type: constant
              value: '?'
        mRID:
          string-field-type: primary_uuid
          value: 00000000-0000-0000-0000-000000000000
      operatingLimit:
        value:
          string-field-type: ignored
    loadControl:
      controlValue:
        identifiedObject:
          description:
            value:
              string-field-type: ignored
          mRID:
            value:
              string-field-type: ignored
          name:
            value:
              string-field-type: ignored
        modBlk:
          value:
            bool-field-type: ignored
        reset:
          value:
            bool-field-type: ignored
      check:
        interlockCheck:
          value:
            bool-field-type: ignored
        synchroCheck:
          value:
            bool-field-type: ignored
      loadControlFSCC:
        controlFSCC:
          logicalNodeForControl:
            logicalNode:
              identifiedObject:
                description:
                  value:
                    string-field-type: ignored
                mRID:
                  value:
                    string-field-type: ignored
                name:
                  value:
                    string-field-type: ignored
          controlScheduleFSCH:
            ValACSG:
              schpts:
              - scheduleParameter:
                - scheduleParameterType: ScheduleParameterKind_W_net_mag
                  outputs:
                  - command-action-type: g41v1
                    command-id: set-kw
                    index: 0
                    scale: 1000000
                - scheduleParameterType: ScheduleParameterKind_VAr_net_mag
                  outputs:
                  - command-action-type: g41v1
                    command-id: set-kw
                    index: 1
                    scale: 1000000
                startTime:
                  control-timestamp-field-type: ignored
          islandControlScheduleFSCH:
            ValACSG:
              schpts:
              - scheduleParameter:
                - scheduleParameterType: ScheduleParameterKind_UNDEFINED
                  outputs:
                  - command-action-type: g41v1
                    command-id: some-command-id
                    index: 0
                    scale: 1
                startTime:
                  control-timestamp-field-type: ignored
        loadControlScheduleFSCH:
          ValDCSG:
            crvpts:
            - rampRates:
                negativeReactivePowerKVArPerMin:
                  value:
                    float-field-type: ignored
                negativeRealPowerKWPerMin:
                  value:
                    float-field-type: ignored
                positiveReactivePowerKVArPerMin:
                  value:
                    float-field-type: ignored
                positiveRealPowerKWPerMin:
                  value:
                    float-field-type: ignored
              reactivePwrSetPointEnabled:
                ctlVal:
                  bool-field-type: ignored
              realPwrSetPointEnabled:
                ctlVal:
                  bool-field-type: ignored
              reset:
                ctlVal:
                  bool-field-type: ignored
              state:
                value:
                  enum-field-type: ignored
              startTime:
                control-timestamp-field-type: ignored
