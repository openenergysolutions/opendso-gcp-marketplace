# Development Environment Values
# Override for local Kubernetes development (minikube, kind, k3s, Docker Desktop)
#
# Usage:
#   helm install dev ./chart -f chart/values-dev.yaml --namespace dev --create-namespace
#
# This configuration uses:
# - LoadBalancer for ingress (MetalLB/minikube tunnel required)
# - Local domain (example: demo.localtest.me with /etc/hosts or wildcard DNS)
# - mkcert for TLS certificates
# - Lower resource limits for local development

global:
  deployment:
    environment: development
    cloudProvider: local

  # Pull all images from GCP Artifact Registry (same as GCP deployment)
  imageRegistry: "us-east1-docker.pkg.dev/opendso-dev/oesinc"

  imagePullSecrets:
    - name: regsecret

  # Storage class for local development
  storageClass: standard  # or hostpath for some local clusters

  # Keycloak configuration
  keycloak:
    enabled: true
    # External URL for browser-based authentication
    url: ""
    # Internal URL for server-to-server communication (e.g., token validation)
    internalUrl: ""
    # Keycloak realm and client IDs
    realm: "oes"
    clientIds:
      ui: "gms"
      api: "gms"

  # Frontend application environment URLs (browser-accessible)
  environment:
    apiUrl: ""
    natsUrl: ""

ingress:
  enabled: true
  className: "nginx"

  # Use LoadBalancer for local development (MetalLB/minikube tunnel required)
  serviceType: LoadBalancer

  # Local domain - requires /etc/hosts entry or wildcard DNS such as *.localtest.me
  domain: "demo.localtest.me"

  # LoadBalancer configuration (standard ports)
  ports:
    http: 80
    https: 443

  # Nginx ingress annotations for buffer sizing
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"

  tls:
    enabled: true
    secretName: ""  # Defaults to <release-name>-tls-secret when unset

    # Don't use cert-manager for local dev
    certManager:
      enabled: false

# Keycloak subchart config
keycloak:
  service:
    type: ClusterIP
  config:
    hostnameStrict: "false"

  # Development resources - balanced for testing
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

# Reduce resource requests for local development
# Override specific services if needed
gms-api:
  replicaCount: 1
  # Increased timeouts for development/debugging
  livenessProbe:
    initialDelaySeconds: 180
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# Topology Nodes — license validation env vars
# LICENSE_KEY and LICENSE_API_KEY are injected via the opendso-license K8s Secret (envFrom).
topology-nodes:
  env:
    PLATFORM_NATS_SERVICE: ""
    PLATFORM_NATS_PORT: "4222"
    LICENSE_API_URL: "https://license-api.demo.localtest.me"

nats:
  tls:
    enabled: true
  nodePort:
    enabled: false
  websocketNodePort:
    enabled: false
    port: 30009
  authCallout:
    enabled: false  # Enabled only via values-nats-auth-generated.yaml

nats-auth-svc:
  jwks: {}
