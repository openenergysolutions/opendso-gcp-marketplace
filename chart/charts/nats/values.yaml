replicaCount: 1

image:
  repository: nats
  pullPolicy: IfNotPresent
  tag: "2.9.9"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  clientPort: 4222
  monitorPort: 8222
  routingPort: 6222
  websocketPort: 9222
  mqttPort: 1883

nodePort:
  enabled: false
  port: 30007

# Optional WebSocket NodePort exposure
websocketNodePort:
  enabled: false
  port: 30009

tls:
  enabled: true
  # Default: <release-name>-tls-secret when unset
  secretName: ""

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

# NATS auth callout configuration (populated by setup-prerequisites.sh)
authCallout:
  enabled: false
  issuer: ""    # account.nk public key  (A...)
  authUser: ""  # user.nk public key     (U...)
  xkey: ""      # xkey.xk public key     (X...)
  # Defaults to <release-name>-nats-auth-keys when unset.
  keysSecretName: ""
  keyProvisioner:
    enabled: true
    backoffLimit: 3
    # Must contain the NATS nk CLI plus POSIX shell, curl, base64, and mktemp.
    image:
      repository: natsio/nats-box
      tag: "latest"
      pullPolicy: IfNotPresent
      digest: ""
      useGlobalRegistry: false
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
  configRenderer:
    image:
      repository: busybox
      tag: "1.36"
      pullPolicy: IfNotPresent
      digest: ""
      useGlobalRegistry: false
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

# Health probes
livenessProbe:
  enabled: true
  tcpSocket:
    port: 4222
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  tcpSocket:
    port: 4222
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
