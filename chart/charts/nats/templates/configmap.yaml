apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nats.fullname" . }}-config
  labels:
    {{- include "nats.labels" . | nindent 4 }}
data:
  nats-server.conf: |
    # Client port of 4222 on all interfaces
    port: {{ .Values.service.clientPort }}

    # HTTP monitoring port
    monitor_port: {{ .Values.service.monitorPort }}

    max_payload: 20971520

    websocket: {
      port: {{ .Values.service.websocketPort }}
      {{- if .Values.tls.enabled }}
      tls: {
        cert_file: "/nats/certs/server-cert.pem"
        key_file: "/nats/certs/server-key.pem"
      }
      {{- else }}
      no_tls: true
      {{- end }}
      handshake_timeout: "10s"
    }

    server_name: mqtt_passthrough

    jetstream {
       store_dir: datastore
    }

    mqtt {
       port: {{ .Values.service.mqttPort }}
    }

    debug: false
    trace: false

    {{- if .Values.authCallout.enabled }}
    {{- $hasStaticKeys := eq (include "nats.authCallout.hasStaticKeys" .) "true" }}
    authorization {
      auth_callout {
        {{- if $hasStaticKeys }}
        issuer: {{ .Values.authCallout.issuer | quote }}
        auth_users: [{{ .Values.authCallout.authUser | quote }}]
        xkey: {{ .Values.authCallout.xkey | quote }}
        {{- else }}
        issuer: "__NATS_AUTH_ISSUER__"
        auth_users: ["__NATS_AUTH_USER__"]
        xkey: "__NATS_AUTH_XKEY__"
        {{- end }}
        account: AUTH
      }
    }

    accounts {
      AUTH {
        {{- if $hasStaticKeys }}
        users: [{nkey: {{ .Values.authCallout.authUser | quote }}}]
        {{- else }}
        users: [{nkey: "__NATS_AUTH_USER__"}]
        {{- end }}
      }
      opendso {}
    }
    {{- end }}
