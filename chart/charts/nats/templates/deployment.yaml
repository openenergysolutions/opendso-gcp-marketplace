apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nats.fullname" . }}
  labels:
    {{- include "nats.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "nats.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "nats.selectorLabels" . | nindent 8 }}
    spec:
      {{- $hasStaticKeys := eq (include "nats.authCallout.hasStaticKeys" .) "true" }}
      {{- $runtimeAuthKeys := and .Values.authCallout.enabled (not $hasStaticKeys) }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $runtimeAuthKeys }}
      initContainers:
        - name: render-auth-callout-config
          image: {{ include "nats.localImage" (dict "imageRoot" .Values.authCallout.configRenderer.image "registry" .Values.global.imageRegistry) | quote }}
          imagePullPolicy: {{ .Values.authCallout.configRenderer.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.authCallout.configRenderer.securityContext | nindent 12 }}
          command:
            - sh
            - -c
            - |
              set -eu
              issuer="$(tr -d '\r\n' < /nats/auth-keys/account.pub)"
              auth_user="$(tr -d '\r\n' < /nats/auth-keys/user.pub)"
              xkey="$(tr -d '\r\n' < /nats/auth-keys/xkey.pub)"

              sed \
                -e "s|__NATS_AUTH_ISSUER__|${issuer}|g" \
                -e "s|__NATS_AUTH_USER__|${auth_user}|g" \
                -e "s|__NATS_AUTH_XKEY__|${xkey}|g" \
                /nats/config-template/nats-server.conf > /nats/rendered/nats-server.conf
          volumeMounts:
            - name: nats-server-conf
              mountPath: /nats/config-template/nats-server.conf
              subPath: nats-server.conf
              readOnly: true
            - name: nats-auth-keys
              mountPath: /nats/auth-keys
              readOnly: true
            - name: rendered-nats-conf
              mountPath: /nats/rendered
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "nats.image" (dict "imageRoot" .Values.global.images.nats "registry" .Values.global.imageRegistry) | quote }}
          imagePullPolicy: {{ .Values.global.images.nats.pullPolicy }}
          args: ["-c", "/nats/conf/nats-server.conf"]
          ports:
            - name: client
              containerPort: {{ .Values.service.clientPort }}
            - name: monitoring
              containerPort: {{ .Values.service.monitorPort }}
            - name: routing
              containerPort: {{ .Values.service.routingPort }}
            - name: websocket
              containerPort: {{ .Values.service.websocketPort }}
            - name: mqtt
              containerPort: {{ .Values.service.mqttPort }}
          volumeMounts:
            {{- if $runtimeAuthKeys }}
            - name: rendered-nats-conf
              mountPath: /nats/conf/nats-server.conf
              subPath: nats-server.conf
              readOnly: true
            {{- else }}
            - name: nats-server-conf
              mountPath: /nats/conf/nats-server.conf
              subPath: nats-server.conf
              readOnly: true
            {{- end }}
            {{- if .Values.tls.enabled }}
            - name: tls-secret
              mountPath: /nats/certs/server-cert.pem
              subPath: tls.crt
              readOnly: true
            - name: tls-secret
              mountPath: /nats/certs/server-key.pem
              subPath: tls.key
              readOnly: true
            {{- end }}
          resources:
            {{- include "opendso.resources" (dict "root" . "category" "services" "explicit" .Values.resources) | nindent 12 }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            {{- if .Values.livenessProbe.httpGet }}
            httpGet:
              path: {{ .Values.livenessProbe.httpGet.path }}
              port: {{ .Values.livenessProbe.httpGet.port }}
            {{- else if .Values.livenessProbe.tcpSocket }}
            tcpSocket:
              port: {{ .Values.livenessProbe.tcpSocket.port }}
            {{- else if .Values.livenessProbe.exec }}
            exec:
              command:
                {{- toYaml .Values.livenessProbe.exec.command | nindent 16 }}
            {{- end }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            {{- if .Values.readinessProbe.httpGet }}
            httpGet:
              path: {{ .Values.readinessProbe.httpGet.path }}
              port: {{ .Values.readinessProbe.httpGet.port }}
            {{- else if .Values.readinessProbe.tcpSocket }}
            tcpSocket:
              port: {{ .Values.readinessProbe.tcpSocket.port }}
            {{- else if .Values.readinessProbe.exec }}
            exec:
              command:
                {{- toYaml .Values.readinessProbe.exec.command | nindent 16 }}
            {{- end }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
      volumes:
        - name: nats-server-conf
          configMap:
            name: {{ include "nats.fullname" . }}-config
        {{- if $runtimeAuthKeys }}
        - name: nats-auth-keys
          secret:
            secretName: {{ include "nats.authCallout.keysSecretName" . }}
        - name: rendered-nats-conf
          emptyDir: {}
        {{- end }}
        {{- if .Values.tls.enabled }}
        - name: tls-secret
          secret:
            secretName: {{ .Values.tls.secretName | default (printf "%s-tls-secret" .Release.Name) }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
