{{- if dig "ess-manager-redis" "enabled" false .Values.global }}
{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ess-manager-redis.serviceAccountName" . }}
  labels:
    {{- include "ess-manager-redis.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
