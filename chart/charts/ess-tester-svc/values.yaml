# Global values inherited from parent chart
global:
  keycloak:
    url: "" # empty string defaults to parent chart value
    internalUrl: ""
    realm: "oes"
    clientIds:
      ui: "gms"
      api: "gms"
      
replicaCount: 1

image:
  repository: oesinc/ess-tester
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

env:
  RUST_LOG: debug
  APP_CONF: /ess/app.yaml

# Site-specific ConfigMap name (generated by parent chart)
siteConfigMap: ""

service:
  type: ClusterIP
  port: 80

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Health probes
livenessProbe:
  enabled: true
  exec:
    command:
      - /bin/sh
      - -c
      - "pgrep -f ess-tester || exit 1"
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  exec:
    command:
      - /bin/sh
      - -c
      - "pgrep -f ess-tester || exit 1"
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
