replicaCount: 1

image:
  repository: oesinc/der-dispatch-app
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8095

containerPort: 8095

# UI Environment Configuration
environment:
  apiUrl: "https://opendso-gms-api:8000"
  natsUrl: ""

tls:
  enabled: false  # Set to true and provide secrets for TLS
  certSecret: server-cert
  keySecret: server-key

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Health probes
livenessProbe:
  enabled: true
  tcpSocket:
    port: 8095
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  tcpSocket:
    port: 8095
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
