apiVersion: v1
kind: Service
metadata:
  name: {{ include "der-dispatch-app.fullname" . }}
  labels:
    {{- include "der-dispatch-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: web
  selector:
    {{- include "der-dispatch-app.selectorLabels" . | nindent 4 }}
