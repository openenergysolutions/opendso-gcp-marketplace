# Global values inherited from parent chart
global:
  keycloak:
    url: "" # empty string defaults to parent chart value
    internalUrl: ""
    realm: "oes"
    clientIds:
      ui: "gms"
      api: "gms"

replicaCount: 1

image:
  repository: oesinc/ess-tester
  pullPolicy: IfNotPresent
  tag: "17ed0c7d"

imagePullSecrets:
  - name: regcred

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8096

containerPort: 8096

# UI Environment Configuration
environment:
  apiUrl: "https://opendso-gms-api:8000"
  natsUrl: "wss://opendso-nats-service-ws:9222"

tls:
  enabled: false  # Set to true and provide secrets for TLS
  certSecret: server-cert
  keySecret: server-key

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Health probes
livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 8096
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 8096
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
