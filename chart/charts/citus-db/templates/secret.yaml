{{- if and (not .Values.externalDatabase.enabled) (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "citus-db.fullname" . }}-secret
  labels:
    {{- include "citus-db.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ required "citus-db auth.password is required when using the in-cluster database" .Values.auth.password | b64enc | quote }}
{{- end }}
