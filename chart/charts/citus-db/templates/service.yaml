{{- if not .Values.externalDatabase.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "citus-db.fullname" . }}
  labels:
    {{- include "citus-db.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: postgresql
      protocol: TCP
      name: postgresql
  selector:
    {{- include "citus-db.selectorLabels" . | nindent 4 }}
{{- end }}
