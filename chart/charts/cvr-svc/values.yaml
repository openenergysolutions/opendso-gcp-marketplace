replicaCount: 1

image:
  repository: oesinc/cvr
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

env:
  RUST_LOG: error
  APP_CONF: /config/app.yaml
  DEVICE_NAME_MAPPING_FILE: /omegadss/omegadss.json

# Site-specific ConfigMap name (generated by parent chart)
siteConfigMap: ""
omegadssConfigMap: ""

service:
  type: ClusterIP
  port: 80

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}
