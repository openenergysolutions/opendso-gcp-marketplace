# Global values inherited from parent chart
# These provide defaults; parent chart values take precedence
global:
  keycloak:
    url: ""
    internalUrl: "" # computed as http://<release>-keycloak-svc:8080 when unset
    realm: "oes"
    clientIds:
      ui: "gms"
      api: "gms"

replicaCount: 1

image:
  repository: oesinc/gms-api
  pullPolicy: IfNotPresent
  tag: "c6ab8cc0"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

# OES license / entitlement. gms-api uses LICENSE_KEY, INSTALLATION_KEY and
# ENTITLEMENT_SERVICE_URL at runtime to validate licenses and filter apps.
# These are operator-provided secrets, not created by this chart.
# Set license.secretName to the name of a Secret holding those keys;
# it is added to the container's envFrom. Leave empty to skip.
license:
  secretName: ""

# Entitlement service configuration (license validation endpoint).
# Set entitlementServiceUrl to enable license-based app filtering.
entitlement:
  serviceUrl: ""
  cacheTtlMs: ""

service:
  type: ClusterIP
  port: 8000

containerPort: 8000

# Orchestration backend used by the /api/orchestration endpoints.
orchestration:
  # "kubernetes" queries the local API server in-cluster via the pod's service
  # account; "docker" talks to a Docker daemon (legacy, not usable on GKE).
  backend: kubernetes
  # Namespace to scope pod queries to. Empty = all namespaces (requires the
  # cluster-scoped RBAC below).
  namespace: ""
  rbac:
    # Create the Role/ClusterRole + binding granting the service account access
    # to pods and pod logs. Required for backend: kubernetes.
    create: true
    # "cluster" = ClusterRole/ClusterRoleBinding (all namespaces);
    # "namespace" = Role/RoleBinding scoped to the release namespace.
    # Namespace-scoped by default: this chart is distributed as a GCP
    # Marketplace listing, and the deployer's service account is not granted
    # permission to create cluster-scoped RBAC resources.
    scope: namespace

# Service configuration
config:
  server:
    port: 8000
    host: "0.0.0.0"
  postgres:
    # Connection (host/port/user/password) is resolved from the shared
    # opendso-apps-db via the opendso.appsDb.settings helper. Only the database
    # name is gms-api-specific.
    database: "settings_api"
  nats:
    url: ""
  tls:
    enabled: true
    certFile: "/home/node/app/certs/server-cert.pem"
    keyFile: "/home/node/app/certs/server-key.pem"
  logging:
    level: "info"

tls:
  enabled: true
  certSecret: server-cert
  keySecret: server-key

persistence:
  enabled: false
  storageClass: nfs-csi
  accessMode: ReadWriteOnce
  size: 100M
  mountPath: /home/node/app/logger

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Health probes
# Note: gms-api has a known startup issue where it may fail to listen on port 8000
# The startup probe gives it multiple chances to start correctly
startupProbe:
  enabled: true
  tcpSocket:
    port: 8000
  initialDelaySeconds: 0
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 12        # 12 * 5 = 60 seconds total to start

livenessProbe:
  enabled: true
  tcpSocket:
    port: 8000
  initialDelaySeconds: 0       # Startup probe handles initial delay
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3          # Restart faster if it stops responding

readinessProbe:
  enabled: true
  tcpSocket:
    port: 8000
  initialDelaySeconds: 0       # Startup probe handles initial delay
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
