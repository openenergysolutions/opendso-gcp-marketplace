{{- if .Values.orchestration.rbac.create -}}
{{- if eq .Values.orchestration.rbac.scope "cluster" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gms-api.fullname" . }}-orchestration
  labels:
    {{- include "gms-api.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gms-api.fullname" . }}-orchestration
  labels:
    {{- include "gms-api.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gms-api.fullname" . }}-orchestration
subjects:
  - kind: ServiceAccount
    name: {{ include "gms-api.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gms-api.fullname" . }}-orchestration
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gms-api.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gms-api.fullname" . }}-orchestration
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gms-api.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gms-api.fullname" . }}-orchestration
subjects:
  - kind: ServiceAccount
    name: {{ include "gms-api.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
