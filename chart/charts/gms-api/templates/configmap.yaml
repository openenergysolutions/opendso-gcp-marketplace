apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gms-api.fullname" . }}-config
  labels:
    {{- include "gms-api.labels" . | nindent 4 }}
data:
  production.env: |
    ## Environment ##
    NODE_ENV=production

    ## Server ##
    PORT={{ .Values.config.server.port }}
    HOST={{ .Values.config.server.host }}
    {{- if .Values.config.tls.enabled }}
    SERVER_CERT=/home/node/app/certs/server-cert.pem
    SERVER_KEY=/home/node/app/certs/server-key.pem
    {{- end }}

    ## Setup jet-logger ##
    JET_LOGGER_MODE=FILE
    JET_LOGGER_FILEPATH={{ .Values.persistence.mountPath }}/jet-logger.log
    JET_LOGGER_TIMESTAMP=TRUE
    JET_LOGGER_FORMAT=LINE

    # expires in 3 days
    COOKIE_EXP=259200000

    # MongoDB (legacy variable names for compatibility)
    MONGO_URI={{ printf "mongodb://%s-mongodb:27017" .Release.Name }}{{- if (index .Values.global "mongodb").tls.enabled }}?tls=true&tlsCAFile=/etc/mongodb/tls/ca.crt&tlsAllowInvalidCertificates=true{{- end }}
    MONGO_DB_NAME={{ .Values.config.mongodb.dbName }}
    MONGODB_DOMAIN={{ printf "%s-mongodb:27017" .Release.Name }}
    MONGODB_DBNAME={{ .Values.config.mongodb.dbName }}
    # MONGODB_USERNAME and MONGODB_PASSWORD are loaded from Secret via environment variables
    {{- if (index .Values.global "mongodb").tls.enabled }}
    # MongoDB TLS Configuration
    MONGODB_TLS_ENABLED=true
    MONGODB_TLS_CA_FILE=/etc/mongodb/tls/ca.crt
    MONGODB_TLS_ALLOW_INVALID_CERTIFICATES=true
    {{- end }}

    # NATS
    NATS_URL={{ printf "nats://%s-nats-service:4222" .Release.Name }}

    # Keycloak
    KEYCLOAK_URL={{ include "opendso.keycloakUrl" . }}
    KEYCLOAK_REALM={{ .Values.global.keycloak.realm }}
    KEYCLOAK_CLIENT_ID={{ .Values.global.keycloak.clientIds.api }}

    # Auth (OpenID Connect)
    # Use internal URL for JWKS (server-to-server communication)
    AUTH_JWKS_URI={{ include "opendso.keycloakInternalUrl" . }}/realms/{{ .Values.global.keycloak.realm }}/protocol/openid-connect/certs
    AUTH_CLIENT_ID={{ .Values.global.keycloak.clientIds.api }}
    # Use external URL for issuer (must match token issuer claim)
    AUTH_ISSUER={{ include "opendso.keycloakUrl" . }}/realms/{{ .Values.global.keycloak.realm }}

    # For dev use only
    ENABLE_CORS=true
