apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gms-api.fullname" . }}-config
  labels:
    {{- include "gms-api.labels" . | nindent 4 }}
data:
  production.env: |
    ## Environment ##
    NODE_ENV=production

    ## Server ##
    PORT={{ .Values.config.server.port }}
    HOST={{ .Values.config.server.host }}
    {{- if .Values.config.tls.enabled }}
    SERVER_CERT=/home/node/app/certs/server-cert.pem
    SERVER_KEY=/home/node/app/certs/server-key.pem
    {{- end }}

    ## Setup jet-logger ##
    JET_LOGGER_MODE=FILE
    JET_LOGGER_FILEPATH={{ .Values.persistence.mountPath }}/jet-logger.log
    JET_LOGGER_TIMESTAMP=TRUE
    JET_LOGGER_FORMAT=LINE

    # expires in 3 days
    COOKIE_EXP=259200000

    # PostgreSQL (shared opendso-apps-db; gms-api uses the 'settings_api' database)
    {{- $appsDb := include "opendso.appsDb.settings" . | fromYaml }}
    POSTGRES_HOST={{ $appsDb.host }}
    POSTGRES_PORT={{ $appsDb.port }}
    POSTGRES_DB={{ .Values.config.postgres.database | default "settings_api" }}
    POSTGRES_USER={{ $appsDb.user }}
    # POSTGRES_PASSWORD is loaded from the apps-db Secret via an environment variable

    # NATS
    NATS_URL={{ printf "nats://%s-nats-service:4222" .Release.Name }}

    # Keycloak
    KEYCLOAK_URL={{ .Values.global.keycloak.url }}
    KEYCLOAK_REALM={{ .Values.global.keycloak.realm }}
    KEYCLOAK_CLIENT_ID={{ .Values.global.keycloak.clientIds.api }}

    # Auth (OpenID Connect)
    # Use internal URL for JWKS (server-to-server communication)
    AUTH_JWKS_URI={{ .Values.global.keycloak.internalUrl }}/realms/{{ .Values.global.keycloak.realm }}/protocol/openid-connect/certs
    AUTH_CLIENT_ID={{ .Values.global.keycloak.clientIds.api }}
    # Use external URL for issuer (must match token issuer claim)
    AUTH_ISSUER={{ .Values.global.keycloak.url }}/realms/{{ .Values.global.keycloak.realm }}

    # For dev use only
    ENABLE_CORS=true
