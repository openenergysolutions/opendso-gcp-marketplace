apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gms-api.fullname" . }}
  labels:
    {{- include "gms-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "gms-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "gms-api.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- else if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "gms-api.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
      # Wait until the settings_api schema is provisioned and seeded (the
      # opendso-apps-db init scripts create the tables and the 'default'
      # auth_settings row). Mirrors the former MongoDB authsettings gate.
      - name: wait-for-postgres-data
        image: {{ include "gms-api.image" (dict "imageRoot" .Values.global.images.appsDb "registry" .Values.global.imageRegistry) | quote }}
        {{- $appsDb := include "opendso.appsDb.settings" . | fromYaml }}
        command:
        - sh
        - -c
        - |
          echo "Waiting for settings_api auth_settings default row..."
          until psql "host={{ $appsDb.host }} port={{ $appsDb.port }} dbname={{ .Values.config.postgres.database | default "settings_api" }} user={{ $appsDb.user }} password=$POSTGRES_PASSWORD" \
            -tAc "SELECT 1 FROM auth_settings WHERE environment_id='default'" 2>/dev/null | grep -q 1; do
            echo "auth_settings not ready yet, waiting..."
            sleep 3
          done
          echo "auth_settings default row found! Proceeding with startup."
        env:
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-opendso-apps-db-secret
                key: password
        resources:
          limits:
            cpu: 200m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "gms-api.image" (dict "imageRoot" .Values.global.images.gmsApi "registry" .Values.global.imageRegistry) | quote }}
          imagePullPolicy: {{ .Values.global.images.gmsApi.pullPolicy }}
          env:
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "0"
            # Orchestration backend: query the local Kubernetes API in-cluster
            # (via the pod's service account) rather than a Docker daemon.
            - name: ORCHESTRATION_BACKEND
              value: {{ .Values.orchestration.backend | quote }}
            {{- if .Values.orchestration.namespace }}
            - name: ORCHESTRATION_NAMESPACE
              value: {{ .Values.orchestration.namespace | quote }}
            {{- end }}
            # PostgreSQL password from the shared opendso-apps-db secret.
            # Host/port/db/user come from the mounted production.env configmap.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-opendso-apps-db-secret
                  key: password
            {{- if .Values.entitlement.serviceUrl }}
            - name: ENTITLEMENT_SERVICE_URL
              value: {{ .Values.entitlement.serviceUrl | quote }}
            {{- end }}
            {{- if .Values.entitlement.cacheTtlMs }}
            - name: ENTITLEMENT_CACHE_TTL_MS
              value: {{ .Values.entitlement.cacheTtlMs | quote }}
            {{- end }}
          {{- if (.Values.license).secretName }}
          envFrom:
            - secretRef:
                name: {{ .Values.license.secretName }}
          {{- end }}
          ports:
            - name: api
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          volumeMounts:
            - name: env
              mountPath: /home/node/app/dist/pre-start/env
              readOnly: true
            {{- if .Values.tls.enabled }}
            - name: cert-file
              mountPath: /home/node/app/certs/server-cert.pem
              subPath: server-cert.pem
              readOnly: true
            - name: key-file
              mountPath: /home/node/app/certs/server-key.pem
              subPath: server-key.pem
              readOnly: true
            {{- end }}
            - name: logger
              mountPath: {{ .Values.persistence.mountPath }}
          resources:
            {{- include "opendso.resources" (dict "root" . "category" "services" "explicit" .Values.resources) | nindent 12 }}

          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            {{- if .Values.startupProbe.httpGet }}
            httpGet:
              path: {{ .Values.startupProbe.httpGet.path }}
              port: {{ .Values.startupProbe.httpGet.port }}
              scheme: {{ .Values.startupProbe.httpGet.scheme | default "HTTP" }}
            {{- else if .Values.startupProbe.tcpSocket }}
            tcpSocket:
              port: {{ .Values.startupProbe.tcpSocket.port }}
            {{- else if .Values.startupProbe.exec }}
            exec:
              command:
                {{- toYaml .Values.startupProbe.exec.command | nindent 16 }}
            {{- end }}
            initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            {{- if .Values.livenessProbe.httpGet }}
            httpGet:
              path: {{ .Values.livenessProbe.httpGet.path }}
              port: {{ .Values.livenessProbe.httpGet.port }}
              scheme: {{ .Values.livenessProbe.httpGet.scheme | default "HTTP" }}
            {{- else if .Values.livenessProbe.tcpSocket }}
            tcpSocket:
              port: {{ .Values.livenessProbe.tcpSocket.port }}
            {{- else if .Values.livenessProbe.exec }}
            exec:
              command:
                {{- toYaml .Values.livenessProbe.exec.command | nindent 16 }}
            {{- end }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            {{- if .Values.readinessProbe.httpGet }}
            httpGet:
              path: {{ .Values.readinessProbe.httpGet.path }}
              port: {{ .Values.readinessProbe.httpGet.port }}
              scheme: {{ .Values.readinessProbe.httpGet.scheme | default "HTTP" }}
            {{- else if .Values.readinessProbe.tcpSocket }}
            tcpSocket:
              port: {{ .Values.readinessProbe.tcpSocket.port }}
            {{- else if .Values.readinessProbe.exec }}
            exec:
              command:
                {{- toYaml .Values.readinessProbe.exec.command | nindent 16 }}
            {{- end }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
      volumes:
        - name: env
          configMap:
            name: {{ include "gms-api.fullname" . }}-config
        {{- if .Values.tls.enabled }}
        - name: cert-file
          secret:
            secretName: {{ .Values.tls.certSecret }}
        - name: key-file
          secret:
            secretName: {{ .Values.tls.keySecret }}
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: logger
          persistentVolumeClaim:
            claimName: {{ include "gms-api.fullname" . }}
        {{- else }}
        - name: logger
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
