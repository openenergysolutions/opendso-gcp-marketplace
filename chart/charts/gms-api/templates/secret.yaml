{{- if .Values.config.mongodb.createSecret }}
{{- $vals := .Values | toYaml | fromYaml -}}
{{- $mongoUsername := .Values.config.mongodb.username | default (dig "mongodb" "auth" "username" "" $vals) -}}
{{- $mongoPassword := .Values.config.mongodb.password | default (dig "mongodb" "auth" "password" "" $vals) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gms-api.fullname" . }}-mongodb
  labels:
    {{- include "gms-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  mongodb-username: {{ required "gms-api MongoDB username is required; set config.mongodb.username or mongodb.auth.username" $mongoUsername | quote }}
  mongodb-password: {{ required "gms-api MongoDB password is required; set config.mongodb.password or mongodb.auth.password" $mongoPassword | quote }}
{{- end }}
