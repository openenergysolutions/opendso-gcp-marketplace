replicaCount: 1

global:
  images: {}

# Site-specific ConfigMap name (generated by parent chart)
siteConfigMap: ""

image:
  repository: oesinc/genetic-cvr
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

env:
  RUST_LOG: error
  GRPC_PORT: "50081"
  DSS_FILE: /dss/IEEE13Nodeckt.dss

service:
  type: ClusterIP
  port: 50081

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}
