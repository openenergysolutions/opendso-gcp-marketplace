replicaCount: 1

global:
  images: {}

# Site-specific ConfigMap name (generated by parent chart)
siteConfigMap: ""
realmConfigMap: ""

image:
  repository: quay.io/keycloak/keycloak
  pullPolicy: IfNotPresent
  tag: "21.1.1"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8080
  nodePort:
    http: 30080
    https: 30443

containerPort: 8080

admin:
  username: admin
  password: ""

proxy: edge

# Keycloak configuration
config:
  httpEnabled: true
  httpPort: 8080
  httpsPort: 8443
  hostname: ""  # defaults to keycloak.<global.domain> via template
  hostnameStrict: "true"
  hostnameStrictHttps: "false"
  hostnameBackchannelDynamic: "true"
  hostnamePort: "443"
  httpsEnabled: false  # proxy=edge: nginx terminates TLS, Keycloak serves HTTP only
  httpsCertFile: "/opt/keycloak/conf/server.crt.pem"
  httpsKeyFile: "/opt/keycloak/conf/server.key.pem"
  importRealm: true  # Set to true to import realm files on startup
  database:
    enabled: false  # Set to true for production with keycloak-db
    vendor: "postgres"
    host: "keycloak-db"
    port: 5432
    name: "keycloak"
    username: "keycloak"
    password: ""
  logLevel: "INFO"

tls:
  enabled: true
  certSecret: server-cert
  keySecret: server-key
  certFilename: server-cert.pem  # Key name in the secret
  keyFilename: server-key.pem  # Key name in the secret

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /opt/keycloak/data/h2

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Health probes
livenessProbe:
  enabled: true
  httpGet:
    path: /realms/master
    port: 8080
  initialDelaySeconds: 120
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  enabled: true
  httpGet:
    path: /realms/master
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
