# Global values inherited from parent chart
global:
  keycloak:
    url: "" # empty string defaults to parent chart value
    internalUrl: ""
    realm: "oes"
    clientIds:
      ui: "gms"
      api: "gms"

replicaCount: 1

image:
  repository: oesinc/ahs-sim
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

env:
  NATS_URL: ""
  LIVE_MODE: true
  AHS_MRID: "0c8316d3-1c47-4bf9-b02c-5e31db0f5b2a"
  INTERVAL_SECS: "60"
  STATE_DIR: "/asset_state"

# Use emptyDir for asset state (can be changed to PVC if persistence needed)
persistence:
  enabled: false
  storageClass: ""
  size: 1Gi

service:
  type: ClusterIP
  port: 80

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Health probes
livenessProbe:
  enabled: true
  exec:
    command:
      - /bin/sh
      - -c
      - "pgrep -f ahs-sim || exit 1"
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  exec:
    command:
      - /bin/sh
      - -c
      - "pgrep -f ahs-sim || exit 1"
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
