# Global values inherited from parent chart
global:
  keycloak:
    url: "" # empty string defaults to parent chart value
    internalUrl: ""
    realm: "oes"
    clientIds:
      ui: "gms"
      api: "gms"
      
replicaCount: 1

image:
  repository: oesinc/opendso-docs-app
  pullPolicy: IfNotPresent
  tag: "c6ab8cc0"

imagePullSecrets:
  - name: regcred

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8092

containerPort: 8092

# No environment config needed for docs app

tls:
  enabled: false  # Set to true and provide secrets for TLS
  certSecret: server-cert
  keySecret: server-key

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Health probes
livenessProbe:
  enabled: true
  tcpSocket:
    port: 8092
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  tcpSocket:
    port: 8092
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
