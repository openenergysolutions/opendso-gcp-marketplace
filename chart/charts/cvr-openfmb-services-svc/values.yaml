replicaCount: 1

image:
  repository: oesinc/openfmb-services
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets:
  - name: regcred

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

env:
  RUST_LOG: error
  GRPC_PORT: "50082"
  APP_CONF: /resources/app.yaml

# Site-specific ConfigMap name (generated by parent chart)
siteConfigMap: ""

service:
  type: ClusterIP
  port: 50082

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}
