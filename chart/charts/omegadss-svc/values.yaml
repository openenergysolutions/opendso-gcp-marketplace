replicaCount: 1

global:
  images: {}

# Site-specific ConfigMap name (generated by parent chart)
siteConfigMap: ""

env:
  REFRESH_SEC: "1"
  PLATFORM_NODE_IP: ""  # overridden in template: nats://<release-name>-nats-service:4222
  RPCDSS_NODE_IP: "http://opendso-rpcdss-svc:50049"    # overridden in template: http://<release-name>-rpcdss-svc:50049
  PUBLISH_UNCHANGED_DATA: "true"

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

livenessProbe:
  enabled: true
  exec:
    command:
      - /usr/local/bin/health
      - omegadss
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  exec:
    command:
      - /usr/local/bin/health
      - --ready
      - omegadss
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
