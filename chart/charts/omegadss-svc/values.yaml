replicaCount: 1

global:
  images: {}

# Site-specific ConfigMap name (generated by parent chart)
siteConfigMap: ""

env:
  REFRESH_SEC: "1"
  PLATFORM_NODE_IP: ""  # overridden in template: nats://<release-name>-nats-service:4222
  RPCDSS_NODE_IP: "http://opendso-rpcdss-svc:50049"    # overridden in template: http://<release-name>-rpcdss-svc:50049
  PUBLISH_UNCHANGED_DATA: "true"

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
