apiVersion: v1
kind: Service
metadata:
  name: {{ include "historian-svc.fullname" . }}
  labels:
    {{- include "historian-svc.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.historian.port }}
      protocol: TCP
      name: grpc
  selector:
    {{- include "historian-svc.selectorLabels" . | nindent 4 }}
