apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "topology-nodes.fullname" . }}
  labels:
    {{- include "topology-nodes.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "topology-nodes.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "topology-nodes.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-for-keycloak
          image: busybox:1.36
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -c
            - |
              echo "Waiting for Keycloak OIDC discovery endpoint..."
              until wget -q -O /dev/null http://{{ .Release.Name }}-keycloak-svc:8080/realms/oes/.well-known/openid-configuration; do
                echo "Keycloak not ready yet, retrying in 5s..."
                sleep 5
              done
              echo "Keycloak is ready"
        {{- if dig "nats-auth-svc" "enabled" false .Values.global }}
        - name: wait-for-nats-auth
          image: busybox:1.36
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -c
            - |
              echo "Waiting for nats-auth-svc to connect to NATS (monitoring: {{ .Release.Name }}-nats-service-mon:8222)..."
              until wget -qO - http://{{ .Release.Name }}-nats-service-mon:8222/connz 2>/dev/null | grep -qE '"num_connections": *[1-9]'; do
                echo "nats-auth-svc not connected yet, retrying in 3s..."
                sleep 3
              done
              echo "nats-auth-svc is connected and ready"
        {{- end }}
        {{- if dig "gcpMarketplace" false .Values.global }}
        - name: wait-for-license-stub
          image: busybox:1.36
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -c
            - |
              echo "Waiting for license stub..."
              until wget -q -O /dev/null http://{{ .Release.Name }}-license-stub.{{ .Release.Namespace }}.svc.cluster.local/v1/license/validate --post-data='{}' 2>/dev/null; do
                echo "License stub not ready yet, retrying in 3s..."
                sleep 3
              done
              echo "License stub is ready"
        {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "topology-nodes.image" (dict "imageRoot" .Values.global.images.topologyNodes "registry" .Values.global.imageRegistry) | quote }}
          imagePullPolicy: {{ .Values.global.images.topologyNodes.pullPolicy }}
          {{- if or .Values.args (dig "nats-auth-svc" "enabled" false .Values.global) }}
          args:
            {{- toYaml .Values.args | nindent 12 }}
            {{- if dig "nats-auth-svc" "enabled" false .Values.global }}
            - "--nats-auth"
            {{- end }}
          {{- end }}
          env:
            - name: PLATFORM_NATS_SERVICE
              value: {{ printf "%s-nats-service" .Release.Name | quote }}
            {{- range $key, $value := .Values.env }}
            {{- if ne $key "PLATFORM_NATS_SERVICE" }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ printf "%s-topology-nodes-keycloak-env" .Release.Name }}
                optional: true
            - secretRef:
                name: {{ printf "%s-opendso-license" .Release.Name }}
                optional: true
          volumeMounts:
            - name: config
              mountPath: /resources
          resources:
            {{- include "opendso.resources" (dict "root" . "category" "services" "explicit" .Values.resources) | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Values.siteConfigMap | default (printf "%s-topology-nodes-site-config" .Release.Name) }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
