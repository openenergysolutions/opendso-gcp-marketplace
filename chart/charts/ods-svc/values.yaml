replicaCount: 1

global:
  images: {}

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podSecurityContext: {}

securityContext:
  runAsUser: 65532
  runAsGroup: 65532
  runAsNonRoot: true

env:
  RUST_LOG: info
  APP_CONF: /config/app.yaml

# Site-specific ConfigMap name (generated by parent chart)
siteConfigMap: ""

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Health probes disabled — scratch image has no shell
livenessProbe:
  enabled: false

readinessProbe:
  enabled: false
