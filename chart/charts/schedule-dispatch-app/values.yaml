# Global values inherited from parent chart
global:
  keycloak:
    url: "" # empty string defaults to parent chart value
    internalUrl: ""
    realm: "oes"
    clientIds:
      ui: "gms"
      api: "gms"

replicaCount: 1

image:
  repository: oesinc/schedule-dispatch-app
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8094

containerPort: 8094

# UI Environment Configuration
environment:
  apiUrl: "https://opendso-gms-api:8000"
  natsUrl: ""

tls:
  enabled: false  # Set to true and provide secrets for TLS
  certSecret: server-cert
  keySecret: server-key

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Health probes
livenessProbe:
  enabled: true
  tcpSocket:
    port: 8094
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  tcpSocket:
    port: 8094
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
