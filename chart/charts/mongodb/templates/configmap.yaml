{{- if .Values.initdb.createConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mongodb.fullname" . }}-init
  labels:
    {{- include "mongodb.labels" . | nindent 4 }}
data:
  mongo-init.js: |
    // Create database and user for GMS API
    db = db.getSiblingDB('{{ .Values.initdb.database }}');

    db.createUser({
      user: '{{ .Values.initdb.username }}',
      pwd: '{{ .Values.initdb.password }}',
      roles: [
        { role: 'readWrite', db: '{{ .Values.initdb.database }}' }
      ]
    });

    // Create initial collections
    db.createCollection('devices');
    db.createCollection('regions');
    db.createCollection('events');
    db.createCollection('settings');

    print('MongoDB initialization completed');
{{- end }}
