# Default values for mongodb
replicaCount: 1

nameOverride: ""
fullnameOverride: ""

# MongoDB configuration
auth:
  rootUsername: admin
  rootPassword: ""
  database: settings_api

# Persistence configuration
persistence:
  enabled: true
  storageClass: ""  # Uses global.storageClass if empty
  dataSize: 10Gi
  logSize: 1Gi
  # WARNING: Setting this to true will DELETE MongoDB PVCs on every helm upgrade
  # Only use in development environments where you want a fresh database
  deleteOnUpgrade: false

# Service configuration
service:
  type: ClusterIP
  port: 27017

# TLS/SSL configuration
# MongoDB is only accessible within the cluster (ClusterIP). TLS is disabled by default
# since inter-pod traffic is internal. Enable if required by compliance policy.
tls:
  enabled: false
  # Secret must contain: mongodb.pem (combined cert+key) and ca.crt
  existingSecret: ""  # Set to <release-name>-mongodb-tls when enabled
  mode: preferTLS
  allowConnectionsWithoutTLS: true

# Resource limits
resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

# Pod configuration
podAnnotations: {}
podSecurityContext:
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 999
  seccompProfile:
    type: RuntimeDefault
securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
nodeSelector: {}
tolerations: []
affinity: {}

# Init DB configuration
initdb:
  enabled: true
  # Set to false when parent chart provides the ConfigMap (default)
  createConfigMap: false
  database: "settings_api"
  username: "gms-api"
  password: ""

# Health probes
# Note: When TLS is enabled, probes automatically use --tls and --tlsCAFile flags
livenessProbe:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
