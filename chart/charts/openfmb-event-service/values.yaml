replicaCount: 1

image:
  repository: oesinc/openfmb-event-service
  pullPolicy: IfNotPresent
  tag: "e94c0826"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  fsGroup: 101

securityContext: {}

env:
  PLATFORM_NATS_SERVICE: ""

args:
  - "-c"
  - "/resources/config.yaml"

# Service configuration
config:
  nats:
    server: ""
    tls:
      enabled: false
      certFile: "/certs/client-cert.pem"
      keyFile: "/certs/client-key.pem"
      caFile: "/certs/ca.pem"
  logging:
    level: "info"
  output:
    path: "/app/output"

persistence:
  enabled: false  # Set to true if you need persistent storage
  storageClass: ""  # Uses global.storageClass if empty
  accessMode: ReadWriteOnce
  size: 100M
  mountPath: /output

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
