    nats:
      repository: nats
      tag: "2.12.5"
      pullPolicy: IfNotPresent
      digest: "sha256:6d12af36c7d6a6f597e7aa1cab9fbaee6d82598f4775231a446d658a61e4655b" # sha256:xxx - when set, overrides tag
    keycloak:
      repository: quay.io/keycloak/keycloak
      tag: "24.0"
      pullPolicy: IfNotPresent
