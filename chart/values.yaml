# Default values for OpenDSO umbrella chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  # Global settings shared across all subcharts
  namespace: ""
  # Site configuration - determines which config files to use
  site: ieee13
  # Container registry settings
  imageRegistry: ""
  imagePullSecrets:
    - name: regsecret
  # Storage settings
  storageClass: standard
  # Common labels
  commonLabels: {}
  # Common annotations
  commonAnnotations: {}
  # =============================================================================
  # Deployment Configuration
  # =============================================================================
  deployment:
    # Environment type: production, development, or staging
    environment: development
    # Cloud provider: gcp, aws, azure, or local
    cloudProvider: local
  # =============================================================================
  # Resource Profile Configuration
  # =============================================================================
  # Resource profiles provide platform-specific resource sizing presets
  # Options: minimal, default, production
  # Override individual service resources as needed
  resourceProfile: minimal
  resourceProfiles:
    minimal:
      databases:
        requests:
          cpu: 75m
          memory: 256Mi
        limits:
          cpu: 250m
          memory: 512Mi
      services:
        requests:
          cpu: 75m
          memory: 128Mi
        limits:
          cpu: 150m
          memory: 256Mi
      frontends:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      # Keycloak is a JVM/Quarkus app, not a lightweight microservice like the
      # rest of "services" — it needs its own headroom, especially for the
      # build-time re-augmentation Quarkus runs on first boot when runtime
      # flags differ from the base image's baked-in build.
      keycloak:
        requests:
          cpu: 150m
          memory: 384Mi
        limits:
          cpu: 500m
          memory: 768Mi
    default: # For dev/staging environments
      databases:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: 2000m
          memory: 4Gi
      services:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1Gi
      frontends:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
      keycloak:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi
    production: # For GKE/EKS production workloads
      databases:
        requests:
          cpu: 1000m
          memory: 2Gi
        limits:
          cpu: 4000m
          memory: 8Gi
      services:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: 2000m
          memory: 2Gi
      frontends:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      keycloak:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: 2000m
          memory: 2Gi
  # =============================================================================
  # Keycloak Configuration (Shared across all charts)
  # =============================================================================
  # Authentication and authorization settings
  # URLs are computed from ingress configuration at deployment time
  keycloak:
    # External URL for browser-based authentication
    # Set by deploy scripts: https://keycloak.<domain>
    url: "" # default; computed from the configured ingress domain when unset
    # Internal URL for service-to-service communication
    # Set by deploy scripts: http://<release-name>-keycloak-svc:8080
    internalUrl: "" # computed as http://<release>-keycloak-svc:8080 when unset
    # Keycloak realm name
    realm: "oes"
    # Client IDs for different services
    clientIds:
      ui: "gms" # For frontend applications
      api: "gms" # For backend API (same client as UI)
  # =============================================================================
  # Frontend Application Environment Configuration
  # =============================================================================
  # URLs used by browser-based frontend applications
  # These must be externally accessible (not internal Kubernetes services)
  environment:
    # API URL for backend services (externally accessible)
    apiUrl: "" # set via overlay or deployer
    # NATS WebSocket URL for real-time messaging (externally accessible)
    natsUrl: "" # set via overlay or deployer
    # Google Analytics configuration
    googleTagId: "GTM-B7JGQS2"
    googleTagEnv: "&gtm_auth=NaiPwz5U_xGuF4hoZ7yHUw&gtm_preview=env-5&gtm_cookies_win=x"
  # =============================================================================
  # TLS Certificate Configuration
  # =============================================================================
  # OPTIONAL: Create TLS secrets via Helm templates
  # By default, secrets are created by deployment scripts (scripts/deploy-*.sh)
  # Set createSecrets: true to have Helm manage these secrets instead
  tls:
    # Enable Helm-managed TLS secrets (default: false - use script-based approach)
    createSecrets: false
    # Certificate content (base64-encoded PEM format)
    # Only used if createSecrets: true
    # These values should be populated via --set-file or CI/CD
    caCert: "" # Root CA certificate
    serverCert: "" # Server certificate
    serverKey: "" # Server private key
  # =============================================================================
  # Centralized Image Configuration
  # =============================================================================
  # All container images and tags in one place for easy version management
  images:
