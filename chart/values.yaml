# =============================================================================
# Ingress Configuration
# =============================================================================
# Unified Ingress for all UI applications and APIs
# Uses subdomain-based routing (best for SPAs and production)
#
# Prerequisites:
#   1. Install an Ingress controller (nginx, traefik, etc.)
#      For nginx: kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/cloud/deploy.yaml
#   2. Wait for controller to be ready: kubectl wait --namespace ingress-nginx --for=condition=ready pod --selector=app.kubernetes.io/component=controller --timeout=120s
#
# Access URLs after enabling (subdomain-based):
#   http://keycloak.demo-gcp.oesinc.dev     → Keycloak user management
#   http://genesis.demo-gcp.oesinc.dev      → Genesis Node App
#   http://gis.demo-gcp.oesinc.dev          → GIS App
#   http://events.demo-gcp.oesinc.dev       → Event Viewer
#   http://inventory.demo-gcp.oesinc.dev    → Inventory Management
#   http://event-creator.demo-gcp.oesinc.dev → OpenFMB Event Creator
#   http://data-viewer.demo-gcp.oesinc.dev  → Data Viewer
#   http://der-dispatch.demo-gcp.oesinc.dev → DER Dispatch
#   http://ess-manager.demo-gcp.oesinc.dev  → ESS Manager
#   http://api.demo-gcp.oesinc.dev          → GMS API
#
# Setup /etc/hosts for local development:
#   192.168.49.2 demo-gcp.oesinc.dev keycloak.demo-gcp.oesinc.dev genesis.demo-gcp.oesinc.dev
#   192.168.49.2 gis.demo-gcp.oesinc.dev events.demo-gcp.oesinc.dev inventory.demo-gcp.oesinc.dev
#   192.168.49.2 event-creator.demo-gcp.oesinc.dev data-viewer.demo-gcp.oesinc.dev
#   192.168.49.2 der-dispatch.demo-gcp.oesinc.dev ess-manager.demo-gcp.oesinc.dev api.demo-gcp.oesinc.dev
#
ingress:
  enabled: true
  className: "nginx"
  # Base domain for all services
  # Development: demo-gcp.oesinc.dev (with /etc/hosts or DNS)
  # Production: your-domain.com (with real DNS)
  domain: "demo-gcp.oesinc.dev"
  # Service type for ingress controller
  # LoadBalancer: Production/cloud (automatic external IP, standard ports 80/443)
  # NodePort: Development/local (custom ports)
  serviceType: LoadBalancer
  # Port configuration
  # Only used when serviceType is NodePort
  ports:
    http: 80
    https: 443
  # Annotations for Ingress controller specific features
  annotations:
    # Increase timeouts for long-running requests
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    # Keycloak can return large headers; increase buffer sizes
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    # Enable CORS for cross-subdomain requests
    # Note: CORS allow-origin is computed dynamically based on ingress.baseUrl
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
  # TLS configuration
  tls:
    enabled: true
    secretName: opendso-tls-secret  # Default: <release-name>-tls-secret (overridden by deploy scripts)
    # cert-manager integration (optional, for automatic Let's Encrypt certificates)
    certManager:
      enabled: false # Set to true for automatic certificates in production
      issuerName: letsencrypt-prod # ClusterIssuer or Issuer name
      issuerKind: ClusterIssuer
# =============================================================================
# Subchart Configuration
# =============================================================================
# Values passed to specific subcharts
# These override subchart default values

# Keycloak Authentication Server
keycloak:
  config:
    # Hostname configuration - uses ingress domain
    hostname: "keycloak.demo-gcp.oesinc.dev" # Will be set to ingress.domain with keycloak subdomain
    # Port configuration - computed from ingress settings
    hostnamePort: "443" # Will be set to ingress HTTPS port
    hostnameStrict: "true" # Force Keycloak to always use configured hostname (prevents internal URLs in responses)
    hostnameStrictHttps: "false"
# NATS Messaging Server
nats:
  # WebSocket NodePort for browser access (development/local environments)
  websocketNodePort:
    enabled: false # Set to true in values-dev.yaml for local development
    port: 30009
# =============================================================================
# Grafana - Monitoring & Dashboards
# =============================================================================
grafana:
  # Admin credentials - using Kubernetes secret
  # Secret is created by parent chart with name: {{ .Release.Name }}-grafana-credentials
  # IMPORTANT: If using a custom release name, override with:
  #   --set grafana.admin.existingSecret=<your-release-name>-grafana-credentials
  admin:
    existingSecret: opendso-grafana-credentials  # Override with: --set grafana.admin.existingSecret=<release-name>-grafana-credentials
    userKey: admin-user
    passwordKey: admin-password
  # Admin user configuration (for reference, actual credentials in secret)
  adminUser: admin
  adminPassword: admin
  # Persistence
  persistence:
    enabled: true
    type: pvc
    storageClassName: standard
    size: 10Gi
  # Disable init container that changes ownership (causes permission issues on upgrade)
  initChownData:
    enabled: false
  # Service configuration
  service:
    type: ClusterIP
    port: 80
  # Ingress will be handled by parent chart
  ingress:
    enabled: false
  # Environment variables for datasource credentials
  # Secret name follows pattern: {{ .Release.Name }}-grafana-credentials
  # IMPORTANT: If using a custom release name, override with:
  #   --set grafana.envValueFrom.CITUS_PASSWORD.secretKeyRef.name=<your-release-name>-grafana-credentials
  #   --set grafana.envValueFrom.OPENDSO_APPS_DB_PASSWORD.secretKeyRef.name=<your-release-name>-grafana-credentials
  envValueFrom:
    CITUS_PASSWORD:
      secretKeyRef:
        name: opendso-grafana-credentials  # Override with: --set "grafana.envValueFrom.CITUS_PASSWORD.secretKeyRef.name=<release-name>-grafana-credentials"
        key: citus-password
    OPENDSO_APPS_DB_PASSWORD:
      secretKeyRef:
        name: opendso-grafana-credentials  # Override with: --set "grafana.envValueFrom.OPENDSO_APPS_DB_PASSWORD.secretKeyRef.name=<release-name>-grafana-credentials"
        key: opendso-apps-db-password
  # Data sources are provisioned via grafana-datasources.yaml template (uses .Release.Name)
  sidecar:
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
  # Plugins to install
  plugins:
    - grafana-mongodb-datasource
  # Resource limits
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  # Environment variables
  env:
    GF_SECURITY_ALLOW_EMBEDDING: "true"
    GF_AUTH_ANONYMOUS_ENABLED: "false"
    GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/"
    GF_SERVER_SERVE_FROM_SUB_PATH: "false"
  # Default dashboards
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
