# =============================================================================
# Ingress Configuration
# =============================================================================
# Unified Ingress for all UI applications and APIs
# Uses subdomain-based routing (best for SPAs and production)
#
# Prerequisites:
#   1. Install an Ingress controller (nginx, traefik, etc.)
#      For nginx: kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/cloud/deploy.yaml
#   2. Wait for controller to be ready: kubectl wait --namespace ingress-nginx --for=condition=ready pod --selector=app.kubernetes.io/component=controller --timeout=120s
#
# Access URLs after enabling (subdomain-based):
#   https://keycloak.<domain>     → Keycloak user management
#   https://gms.<domain>          → Genesis Node App
#   https://gis.<domain>          → GIS App
#   https://eventviewer.<domain>  → Event Viewer
#   https://inventory.<domain>    → Inventory Management
#   https://openfmbeventcreator.<domain> → OpenFMB Event Creator
#   https://dataviewer.<domain>   → Data Viewer
#   https://derdispatch.<domain>  → DER Dispatch
#   https://device.<domain>       → ESS Manager
#   https://api.<domain>          → GMS API
#
ingress:
  enabled: true
  className: "nginx"
  # Base domain for all services, for example: opendso.example.com
  domain: ""
  # Service type for ingress controller
  serviceType: LoadBalancer
  # Port configuration
  # Only used when serviceType is NodePort
  ports:
    http: 80
    https: 443
  # Annotations for Ingress controller specific features
  annotations:
    # Increase timeouts for long-running requests
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    # Keycloak can return large headers; increase buffer sizes
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    # Enable CORS for cross-subdomain requests
    # Note: CORS allow-origin is computed dynamically based on ingress.baseUrl
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
  # TLS configuration
  tls:
    enabled: true
    secretName: "" # Defaults to <release-name>-tls-secret when unset
    # cert-manager integration (optional, for automatic Let's Encrypt certificates)
    certManager:
      enabled: false # Set to true for automatic certificates in production
      issuerName: letsencrypt-prod # ClusterIssuer or Issuer name
      issuerKind: ClusterIssuer
# =============================================================================
# Subchart Configuration
# =============================================================================
# Values passed to specific subcharts
# These override subchart default values

# Keycloak Authentication Server
keycloak:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  config:
    # Hostname configuration - uses ingress domain
    hostname: "" # Computed as keycloak.<domain> when unset
    # Port configuration - computed from ingress settings
    hostnamePort: "443" # Will be set to ingress HTTPS port
    hostnameStrict: "true" # Force Keycloak to always use configured hostname (prevents internal URLs in responses)
    hostnameStrictHttps: "false"
  readinessProbe:
    initialDelaySeconds: 120
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  livenessProbe:
    initialDelaySeconds: 180
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
# NATS Messaging Server
nats:
  podSecurityContext: {}
  securityContext: {}
  websocketNodePort:
    enabled: false
    port: 30009
