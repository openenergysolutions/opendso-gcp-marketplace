# OpenDSO Helm Chart - GCP/GKE Production Values
# This file contains GCP-specific configurations for deploying OpenDSO to Google Kubernetes Engine

global:
  # Deployment environment configuration
  deployment:
    environment: production
    cloudProvider: gcp

  # Resource profile (minimal, default, production)
  resourceProfile: production

  # Domain configuration
  # IMPORTANT: Set to your actual production domain
  domain: ""

  # Storage class for GKE persistent disks
  # Options: "standard-rwo" (HDD) or "pd-ssd" (SSD)
  # pd-ssd recommended for production workloads
  storageClass: "standard-rwo"

  imageRegistry: ""  # Set via global.imageRegistry parameter or --set at deploy time

  # Image pull secrets
  imagePullSecrets:
    - name: regsecret

  # Frontend environment variables
  # These URLs are exposed to browser clients
  environment:
    apiUrl: ""
    natsUrl: ""
    googleTagId: "GTM-B7JGQS2"

  # Keycloak configuration
  keycloak:
    url: ""
    internalUrl: ""
    realm: "oes"
    clientIds:
      ui: "gms"
      api: "gms"

  # TLS secret containing the ingress certificate
  tls:
    existingSecret: "opendso-tls"  # Created by create-certs.sh

  # Database Services (global enable/disable flags)
  mongodb:
    enabled: true
    tls:
      enabled: false

  citus-db:
    enabled: true

  # topology-genesis: cim.xml is 367KB — exceeds the 262KB Kubernetes annotation limit
  # when using kubectl apply (client-side). The deployer pre-creates this ConfigMap via
  # kubectl apply --server-side and sets externalConfigMap=true so Helm skips creating it.
  topology-genesis:
    enabled: true

# ============================================================================
# Database Services (Subchart-specific configurations)
# ============================================================================

# MongoDB configuration
mongodb:
  enabled: true  # Set to false if using MongoDB Atlas

  persistence:
    enabled: true
    # storageClass: standard-rwo  # Uses global.storageClass
    dataSize: 10Gi  # Production size 
    logSize: 5Gi
    deleteOnUpgrade: false  # IMPORTANT: Keep data on upgrades

  initdb:
    createConfigMap: false  # Parent chart provides the ConfigMap

  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 1000m
      memory: 2Gi

  # MongoDB TLS disabled — internal ClusterIP traffic only
  # tls:
  #   enabled: true
  #   existingSecret: "<release-name>-mongodb-tls"

  # External MongoDB configuration (if using managed service)
  # Uncomment and configure if enabled: false
  # externalDatabase:
  #   enabled: true
  #   host: "your-mongodb-atlas-url"
  #   port: 27017
  #   database: "settings_api"
  #   existingSecret: "mongodb-credentials"
  #   usernameKey: "username"
  #   passwordKey: "password"

# Citus DB (PostgreSQL) configuration
citus-db:
  enabled: true  # Set to false if using Cloud SQL
  podSecurityContext: {}
  securityContext: {}

  persistence:
    enabled: true
    # storageClass: standard-rwo  # Uses global.storageClass
    size: 50Gi  # Production size (dev: 10Gi)

  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 1000m
      memory: 2Gi

  # External PostgreSQL configuration (if using Cloud SQL)
  # Uncomment and configure if enabled: false
  # externalDatabase:
  #   enabled: true
  #   host: "your-cloudsql-host"
  #   port: 5432
  #   database: "ofmb_db"
  #   username: "citususer"
  #   existingSecret: "citus-db-credentials"
  #   usernameKey: "username"
  #   passwordKey: "password"

# OpenDSO Apps DB (TimescaleDB/PostgreSQL) configuration
opendso-apps-db:
  enabled: true
  podSecurityContext: {}
  securityContext: {}

  persistence:
    enabled: true
    # storageClass: standard-rwo  # Uses global.storageClass
    size: 10Gi

  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

  # External PostgreSQL configuration (if using Cloud SQL)
  # externalDatabase:
  #   enabled: true
  #   host: "your-cloudsql-host"
  #   port: 5432
  #   database: "ess_tester"
  #   username: "essuser"
  #   existingSecret: "apps-db-credentials"

# ============================================================================
# Core Services
# ============================================================================

# Keycloak (Authentication)
keycloak:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  config:
    # Hostname (OPTIONAL - defaults to keycloak.{global.domain})
    # Only set this if you want Keycloak to use a different hostname
    # hostname: "keycloak.your-domain.example.com"
    hostnamePort: "443"
    hostnameStrict: "true"
    httpsEnabled: true
    httpsCertFile: "/opt/keycloak/conf/server.crt.pem"
    httpsKeyFile: "/opt/keycloak/conf/server.key.pem"

  persistence:
    enabled: true
    # storageClass: standard-rwo  # Uses global.storageClass
    size: 10Gi
  readinessProbe:
    initialDelaySeconds: 120
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  livenessProbe:
    initialDelaySeconds: 180
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 1000m
      memory: 1Gi

# GMS API (Backend REST API)
gms-api:
  replicaCount: 1  # High availability

  tls:
    enabled: false

  config:
    # GKE uses containerd — no Docker socket at /var/run/docker.sock.
    # Set DOCKER_API to a local address so gms-api initializes without crashing.
    # Orchestration API calls will fail gracefully at runtime (no node containers to show).
    dockerApi: "http://127.0.0.1:2376"
    tls:
      enabled: false

  # Health probe configuration
  livenessProbe:
    initialDelaySeconds: 180
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

  persistence:
    enabled: false  # Set to true if you need persistent logs
    # storageClass: standard-rwo  # Uses global.storageClass
    size: 1Gi

# Topology Nodes — license validation env vars
# LICENSE_KEY and LICENSE_API_KEY are injected via the opendso-license K8s Secret (envFrom).
topology-nodes:
  env:
    PLATFORM_NATS_SERVICE: ""
    PLATFORM_NATS_PORT: "4222"
    LICENSE_API_URL: ""

# NATS (Message Bus)
nats:
  podSecurityContext: {}
  securityContext: {}
  tls:
    enabled: true
    secretName: ""  # Defaults to <release-name>-tls-secret when unset
  authCallout:
    enabled: false  # Enabled only via values-nats-auth-generated.yaml

  # Disable NodePort (using LoadBalancer/Ingress)
  nodePort:
    enabled: false
  websocketNodePort:
    enabled: false

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# Historian Service
historian-svc:
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# ESS Manager Redis (Cache)
ess-manager-redis:
  podSecurityContext: {}
  securityContext: {}
  persistence:
    enabled: true
    # storageClass: standard-rwo  # Uses global.storageClass
    size: 1Gi

  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# ESS Manager Service
ess-manager-svc:
  env:
    RUST_LOG: debug
    APP_CONF: /etc/ess/app.yaml
    DAY_AHEAD_DIR: /var/lib/ess/dayahead
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

