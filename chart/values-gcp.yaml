# ============================================================================
# Notes - Demo/POC Deployment with Google Cloud Endpoints
# ============================================================================

# This configuration uses Google Cloud Endpoints domain for demo/POC:
# Domain: demo-gcp.oesinc.dev
# Certificates: Self-signed (from scripts/lib/create-certs.sh)
#
# Before deploying:
# 1. Create GKE cluster and configure kubectl
# 2. Install nginx-ingress controller with LoadBalancer
# 3. Create namespace: kubectl create namespace opendso
# 4. Generate self-signed certificates:
#    ./scripts/lib/create-certs.sh opendso demo-gcp.oesinc.dev
# 5. Create registry secret (if using private registry):
#    kubectl create secret docker-registry regsecret ...
# 6. Configure Cloud Endpoints ESP:
#    - Map *.demo-gcp.oesinc.dev to LoadBalancer IP
#    - Or use individual subdomain mappings in Cloud Endpoints
#
# Deploy with:
# helm install opendso ./opendso -f values-gcp.yaml -n opendso --timeout 15m
#
# Note: Browsers will show certificate warnings with self-signed certs.
# For production, use a real domain name with Let's Encrypt or Google-managed certificates.
