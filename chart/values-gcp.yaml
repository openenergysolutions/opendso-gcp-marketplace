# ============================================================================
# Ingress Configuration
# ============================================================================

ingress:
  enabled: true
  className: nginx
  serviceType: LoadBalancer

  # LoadBalancer configuration (standard ports)
  ports:
    http: 80
    https: 443

  # Domain for all ingress routes (OPTIONAL - defaults to global.domain)
  # Only set this if you want ingress to use a different domain than global.domain
  # domain: "demo-gcp.oesinc.dev"

  # TLS configuration
  # Using cert-manager with Let's Encrypt for automatic certificate management
  tls:
    enabled: true
    certManager:
      enabled: true  # Automatic Let's Encrypt certificates
      issuerName: letsencrypt-prod  # Use 'letsencrypt-staging' for testing
    # Self-signed certificate secret (only used if certManager.enabled=false)
    # secretName: "opendso-tls"

  # Ingress annotations
  annotations:

    # Force SSL redirect
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # Proxy timeouts (important for long-running requests)
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"

    # Buffer settings (for large headers from Keycloak)
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"

    # CORS settings
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"

    # GCP-specific annotations (uncomment if needed)
    # cloud.google.com/neg: '{"ingress": true}'
    # cloud.google.com/backend-config: '{"default": "opendso-backend-config"}'

