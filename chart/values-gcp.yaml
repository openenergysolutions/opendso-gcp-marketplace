# ============================================================================
# Ingress Configuration
# ============================================================================

ingress:
  enabled: true
  className: nginx
  serviceType: LoadBalancer

  # LoadBalancer configuration (standard ports)
  ports:
    http: 80
    https: 443

  # Domain for all ingress routes (OPTIONAL - defaults to global.domain)
  # Only set this if you want ingress to use a different domain than global.domain
  # domain: "your-domain.example.com"

  # TLS configuration
  # Using cert-manager with Let's Encrypt for automatic certificate management
  tls:
    enabled: true
    certManager:
      enabled: true  # Automatic Let's Encrypt certificates
      issuerName: letsencrypt-prod  # Use 'letsencrypt-staging' for testing
    # Self-signed certificate secret (only used if certManager.enabled=false)
    # secretName: "opendso-tls"

  # Ingress annotations
  annotations:

    # Force SSL redirect
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # Proxy timeouts (important for long-running requests)
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"

    # Buffer settings (for large headers from Keycloak)
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"

    # CORS settings
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"

    # GCP-specific annotations (uncomment if needed)
    # cloud.google.com/neg: '{"ingress": true}'
    # cloud.google.com/backend-config: '{"default": "opendso-backend-config"}'

# ============================================================================
# Monitoring & Observability
# ============================================================================

# Grafana (Monitoring/Dashboards)
grafana:
  # Use namespace-scoped Role instead of ClusterRole/ClusterRoleBinding.
  # The GCP Marketplace deployer SA only has namespace-scoped permissions.
  rbac:
    namespaced: true

  persistence:
    enabled: true
    # storageClass: standard-rwo  # Uses global.storageClass
    size: 10Gi

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  readinessProbe:
    initialDelaySeconds: 120
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  livenessProbe:
    initialDelaySeconds: 180
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

  # Admin credentials
  # Default: admin / (auto-generated password in secret)
  # Change this after first login!

# ============================================================================
# Optional Services (disabled by default)
# ============================================================================

# DER Management Service
der-management:
  enabled: false

# Asset Health Sim Service
asset-health-sim-service:
  enabled: false

# Keycloak DB (separate database for Keycloak)
keycloak-db:
  enabled: false
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

# ============================================================================
# Notes - Production Deployment
# ============================================================================
#
# Before deploying:
# 1. Create or select the target GKE cluster and namespace
# 2. Install an ingress controller with external access
# 3. Set `global.domain` to a customer-owned domain
# 4. Provision the TLS secret expected by the release
# 5. Ensure Artifact Registry pull access is configured
